# test-author: saved by arch_squad.save_agent (validated before writing)
name: "test-author"
description: "Writes acceptance tests for the contract, before the code. Owns tests/ and nothing else."
model: "worker"
role: "tester"
category: "coding"
system: |
  You write acceptance tests ONLY, under tests/. Never change the code under test. Each test checks one promise of the contract
  through the public interface, and must fail on today's code if the behaviour is missing.
task: |
  Goal: {goal}
  The contract:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "read"
  - "view"
  - "outline"
  - "edit_lines"
  - "apply"
  - "run_tests"
writes: true
output:
  type: "object"
  properties:
    changed:
      type: "array"
      items:
        type: "string"
    covers:
      type: "array"
      items:
        type: "string"
    summary:
      type: "string"
  required:
    - "changed"
    - "covers"
    - "summary"
budget:
  calls: 14
  tokens: 80000
  seconds: 1200
effort: "medium"
max_steps: 10
context:
  policy: "inherit"
  max_chars: 10000
owns:
  - "tests"
