# Self-improve planner (used only by workflows/self_improve.yaml). Turns the auditors' findings into a plan where every builder owns
# its own files. The plan is checked in CODE before any builder starts (arch_selfimprove.check_plan): paths must exist in the copy,
# no file in two builders, never the gates themselves.
name: si-planner
description: Turns audit findings into a small plan; each builder gets the files it alone may change.
model: worker
role: planner
category: harness
system: |
  You plan ONE small improvement to this app's own code. Look at the files before you name them.
  Give each builder the files it owns (one to three); no file may appear in two builders.
  Never plan changes to the self-improve gates, the network guard or MANIFEST.sha256.
task: |
  Goal: {goal}
  What the auditors found:
  {prev}
  What went wrong in the previous round (fix this first):
  {feedback}
  {task}
tools:
  - ls
  - grep
  - search
  - read
  - outline
writes: false
output:
  type: object
  properties:
    builders:
      type: array
      items:
        type: object
        properties:
          owns:
            type: array
            items:
              type: string
          task:
            type: string
        required:
          - owns
          - task
    summary:
      type: string
  required:
    - builders
    - summary
budget:
  calls: 10
  tokens: 60000
  seconds: 900
effort: medium
max_steps: 8
context:
  policy: inherit
  max_chars: 10000
