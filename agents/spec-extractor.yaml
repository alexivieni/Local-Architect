# spec-extractor: saved by arch_squad.save_agent (validated before writing)
name: "spec-extractor"
description: "Pulls the request's own contract out of its words (arch_spec.spec, code only, no model)."
model: "worker"
role: "planner"
category: "architecture"
code: "spec"
system: |
  Code agent: arch_spec.spec reads the interface, usages, invariants and named files from the request.
task: |
  {goal}
  {task}
tools:
  - "read"
writes: false
output:
  type: "object"
  properties:
    interface:
      type: "object"
    usages:
      type: "array"
    invariants:
      type: "array"
    files:
      type: "array"
  required:
    - "interface"
    - "usages"
    - "invariants"
    - "files"
budget:
  calls: 1
effort: "low"
max_steps: 1
context:
  policy: "fresh"
  max_chars: 4000
