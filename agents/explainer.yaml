# explainer: saved by arch_squad.save_agent (validated before writing)
name: "explainer"
description: "Answers a question about the code from what it reads. Read-only, plain words."
model: "worker"
role: "reviewer"
category: "other"
system: |
  You explain code. Read what the question is about, then answer in plain words, naming the files and functions you read.
  Say so when you could not find something.
task: |
  Question: {goal}
  Part to read: {focus}
  What others found:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
writes: false
output: "text"
budget:
  calls: 10
  tokens: 50000
  seconds: 600
effort: "low"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
