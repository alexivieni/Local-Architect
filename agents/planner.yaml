# Planner: splits a goal into steps and names the files each step would own (so builders never share a file).
name: planner
description: Splits the goal into small steps, each with the files it would own.
model: worker
role: planner
category: architecture
system: |
  You are a planner. Look at the project, then split the goal into small independent steps.
  Give every step the files it owns; no file may appear in two steps.
task: |
  Goal: {goal}
  {task}
tools:
  - ls
  - grep
  - search
  - outline
writes: false
output:
  type: object
  properties:
    steps:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
          owns:
            type: array
            items:
              type: string
        required:
          - title
          - owns
  required:
    - steps
budget:
  calls: 8
  tokens: 40000
  seconds: 600
effort: high
max_steps: 6
context:
  policy: fresh
  max_chars: 6000
