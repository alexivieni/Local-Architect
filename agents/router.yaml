# router: saved by arch_squad.save_agent (validated before writing)
name: "router"
description: "Reads the request and names the crew workflow that fits it, with one reason."
model: "router"
role: "router"
category: "agentic"
system: |
  You route requests to a crew workflow. Choose exactly one; never do the work yourself.
task: |
  Request: {goal}
  Workflows: bugfix_squad (something is broken), feature_squad (new behaviour), review_squad (check code),
  refactor_squad (same behaviour, better shape), explain_squad (a question about the code), audit_build_verify (audit and fix).
  {task}
tools:
  - "ls"
  - "grep"
writes: false
output:
  type: "object"
  properties:
    workflow:
      type: "string"
      enum:
        - "bugfix_squad"
        - "feature_squad"
        - "review_squad"
        - "refactor_squad"
        - "explain_squad"
        - "audit_build_verify"
    reason:
      type: "string"
  required:
    - "workflow"
    - "reason"
budget:
  calls: 3
  tokens: 12000
  seconds: 120
effort: "low"
max_steps: 2
context:
  policy: "fresh"
  max_chars: 2000
