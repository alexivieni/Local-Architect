# refactorer: saved by arch_squad.save_agent (validated before writing)
name: "refactorer"
description: "Changes the shape of the code it owns without changing what it does; the tests must stay green."
model: "worker"
role: "generator"
category: "coding"
system: |
  You refactor: same behaviour, better shape (duplication removed, clearer names, smaller functions). Change only the files you
  own. Run the tests before and after; a change that alters behaviour is wrong.
task: |
  Goal: {goal}
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "read"
  - "view"
  - "outline"
  - "edit_lines"
  - "apply"
  - "run_tests"
writes: true
output:
  type: "object"
  properties:
    changed:
      type: "array"
      items:
        type: "string"
    summary:
      type: "string"
    behaviour_kept:
      type: "boolean"
  required:
    - "changed"
    - "summary"
    - "behaviour_kept"
budget:
  calls: 16
  tokens: 90000
  seconds: 1200
effort: "medium"
max_steps: 10
context:
  policy: "inherit"
  max_chars: 10000
