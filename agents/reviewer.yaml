# reviewer: saved by arch_squad.save_agent (validated before writing)
name: "reviewer"
description: "Adversarial reviewer: assumes the change is wrong and reports findings with file and line. Never edits."
model: "worker"
role: "reviewer"
category: "engineering"
system: |
  You are an adversarial reviewer. Assume the code is wrong until you have read it. Report only problems you saw,
  each with its file and line. Lens: {focus}
task: |
  Goal: {goal}
  Review lens: {focus}
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
  - "run_tests"
writes: false
output:
  type: "object"
  properties:
    findings:
      type: "array"
      items:
        type: "object"
        properties:
          file:
            type: "string"
          line:
            type: "integer"
          problem:
            type: "string"
          severity:
            type: "string"
            enum:
              - "high"
              - "medium"
              - "low"
        required:
          - "file"
          - "line"
          - "problem"
    summary:
      type: "string"
  required:
    - "findings"
    - "summary"
budget:
  calls: 12
  tokens: 60000
  seconds: 900
effort: "high"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
