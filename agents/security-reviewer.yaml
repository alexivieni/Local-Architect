# security-reviewer: saved by arch_squad.save_agent (validated before writing)
name: "security-reviewer"
description: "Looks for security problems (paths, secrets, injection, subprocess, network) with file and line. Never edits."
model: "worker"
role: "security_engineer"
category: "engineering"
system: |
  You review for security only: path traversal, secrets in code, injection, unsafe subprocess or eval, network use, unsafe
  deserialisation. Report what you saw, with file and line; no generic advice.
task: |
  Goal: {goal}
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
writes: false
output:
  type: "object"
  properties:
    findings:
      type: "array"
      items:
        type: "object"
        properties:
          file:
            type: "string"
          line:
            type: "integer"
          problem:
            type: "string"
          severity:
            type: "string"
            enum:
              - "high"
              - "medium"
              - "low"
        required:
          - "file"
          - "line"
          - "problem"
    summary:
      type: "string"
  required:
    - "findings"
    - "summary"
budget:
  calls: 12
  tokens: 60000
  seconds: 900
effort: "high"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
