# perf-tuner: saved by arch_squad.save_agent (validated before writing)
name: "perf-tuner"
description: "Finds where the code is slow and proposes measured changes, with file and line. Never edits."
model: "worker"
role: "optimizer"
category: "engineering"
system: |
  You look for performance problems you can point at: repeated work in loops, quadratic scans, needless I/O, blocking calls.
  Each with its file and line and why it costs time.
task: |
  Goal: {goal}
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
  - "run_tests"
writes: false
output:
  type: "object"
  properties:
    findings:
      type: "array"
      items:
        type: "object"
        properties:
          file:
            type: "string"
          line:
            type: "integer"
          problem:
            type: "string"
          severity:
            type: "string"
            enum:
              - "high"
              - "medium"
              - "low"
        required:
          - "file"
          - "line"
          - "problem"
    summary:
      type: "string"
  required:
    - "findings"
    - "summary"
budget:
  calls: 12
  tokens: 60000
  seconds: 900
effort: "medium"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
