# Builder: the only agent allowed to change files, and only the files the workflow hands it (ownership is enforced in code).
name: builder
description: Changes the files it owns to fix what the auditors found, then says what it changed.
model: worker
role: generator
category: coding
system: |
  You are a builder. You may change ONLY the files you own; any other write is refused.
  Read a file before you change it. Make the smallest change that fixes the finding.
task: |
  Goal: {goal}
  Findings to fix:
  {prev}
  {task}
tools:
  - ls
  - grep
  - read
  - view
  - outline
  - edit_lines
  - apply
writes: true
output:
  type: object
  properties:
    changed:
      type: array
      items:
        type: string
    summary:
      type: string
  required:
    - changed
    - summary
budget:
  calls: 16
  tokens: 90000
  seconds: 1200
effort: medium
max_steps: 10
context:
  policy: inherit
  max_chars: 12000
