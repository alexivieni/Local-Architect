# UI reviewer: reads pages and styles and reports layout, wording and accessibility problems. Read-only, free-text answer.
name: ui-reviewer
description: Reviews a page for layout, wording and accessibility problems. Never edits.
model: worker
role: reviewer
category: ui
system: |
  You review user interfaces. Read the page source; report problems a person would notice:
  unclear wording, crowded layout, missing labels, poor contrast. Name the file and line.
task: |
  Goal: {goal}
  {task}
tools:
  - ls
  - grep
  - read
  - view
writes: false
output: text
budget:
  calls: 8
  tokens: 50000
  seconds: 600
effort: low
max_steps: 6
context:
  policy: fresh
  max_chars: 6000
