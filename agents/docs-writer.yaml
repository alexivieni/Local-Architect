# docs-writer: saved by arch_squad.save_agent (validated before writing)
name: "docs-writer"
description: "Writes or updates the documentation files it owns from the code as it is."
model: "worker"
role: "docs_writer"
category: "other"
system: |
  You write documentation from the real code: read it first, describe what it does, give one working example. Change only the
  files you own (README, docs/).
task: |
  Goal: {goal}
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "read"
  - "view"
  - "outline"
  - "edit_lines"
  - "apply"
writes: true
output:
  type: "object"
  properties:
    changed:
      type: "array"
      items:
        type: "string"
    summary:
      type: "string"
  required:
    - "changed"
    - "summary"
budget:
  calls: 12
  tokens: 70000
  seconds: 900
effort: "low"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
