# The flow of pack claude_plans_feature_team (built from harness.yaml).
id: "claude_plans_feature_team"
title: "Claude plans, local builds: feature team"
kind: "plan_execute_verify"
blurb: "Claude writes the plan with an acceptance contract per sprint and judges the result; the local worker writes every line; the whole suite must pass at the end; a read-only Claude reviewer can be launched afterwards from fleet.json."
domains:
  - "api"
  - "data"
  - "web"
produces:
  - "source files"
  - "tests/"
  - ".arch/handoff.json"
uses_roles:
  - "planner"
  - "generator"
  - "generator_ui"
  - "generator_sql"
  - "evaluator"
budget:
  calls: 40
  tokens: 240000
  seconds: 3600
  heavy_calls: 4
context:
  chars: 9000
overrides:
  gpu6:
    budget:
      tokens: 220000
  cpu8:
    budget:
      calls: 30
      tokens: 100000
      seconds: 3600
    skip:
      - "judge_local"
  cpu16:
    budget:
      seconds: 3600
steps:
  - id: "plan_cloud"
    kind: "ask_json"
    title: "Plan + contracts (Claude)"
    role: "planner"
    prompt: "plan_local_build/plan"
    schema: "PLAN"
    store: "plan_doc"
    when: "cfg.online.enabled and cfg.online.cloud_tier in ['plan', 'all']"
    vars:
      max_sprints: "{cfg.limits.max_sprints}"
    context:
      chars: 12000
    budget:
      tokens: 40000
      seconds: 600
  - id: "plan_heavy"
    kind: "ask_json"
    title: "Plan + contracts (heavy tier)"
    role: "planner"
    tier: "heavy"
    prompt: "plan_local_build/plan"
    schema: "PLAN"
    store: "plan_doc"
    when: "not (cfg.online.enabled and cfg.online.cloud_tier in ['plan', 'all'])"
    vars:
      max_sprints: "{cfg.limits.max_sprints}"
    context:
      chars: 9000
    budget:
      tokens: 40000
      seconds: 900
  - id: "sprints"
    kind: "foreach"
    title: "Sprint"
    over: "plan_doc"
    key: "sprints"
    max: 6
    stop_on_fail: true
    fallback:
      - name: "implementation"
        kind: "mixed"
        goal: "{goal}"
        acceptance:
          - id: "A1"
            text: "the goal works and the tests pass"
    steps:
      - id: "write"
        kind: "generate"
        title: "Write the sprint (local worker)"
        role: "generator*"
        tier: "worker"
        prompt: "plan_local_build/sprint"
        vars:
          n: "{item_n}"
          total: "{item_total}"
          name: "{item.name}"
          sgoal: "{item_goal}"
          criteria: "{item_criteria}"
        context:
          query: "{item_goal} {item_files}"
          always:
            - "docs/spec.md"
            - "docs/architecture.md"
            - "api/openapi.json"
            - "db/schema.sql"
          max_always: 3
        verify:
          gate: "verify_files"
          run_tests: true
        loop:
          max: 3
          coach: true
          escalate:
            - "heavy"
        budget:
          tokens: 120000
          seconds: 1800
  - id: "judge_cloud"
    kind: "judge"
    title: "Judge against the contract (Claude)"
    what: "whole build"
    criteria: "the public interface, exactly as planned:\n{plan_doc.interface}\nevery acceptance criterion in this plan, one score each:\n{plan_doc.sprints}\nno_stubs (no placeholder or fake behaviour)"
    requires: "sprints.ok and cfg.behavior.evaluator != 'off' and cfg.online.enabled and cfg.online.cloud_tier in ['plan', 'all']"
    evidence:
      tests: true
    on_fail: "continue"
    budget:
      tokens: 40000
      seconds: 600
  - id: "judge_local"
    kind: "judge"
    title: "Judge against the contract (heavy tier)"
    tier: "heavy"
    what: "whole build"
    criteria: "the public interface, exactly as planned:\n{plan_doc.interface}\nevery acceptance criterion in this plan, one score each:\n{plan_doc.sprints}\nno_stubs (no placeholder or fake behaviour)"
    requires: "sprints.ok and cfg.behavior.evaluator != 'off' and not (cfg.online.enabled and cfg.online.cloud_tier in ['plan', 'all'])"
    evidence:
      tests: true
    on_fail: "continue"
    budget:
      tokens: 40000
      seconds: 600
  - id: "save"
    kind: "handoff"
    title: "Save progress for the next session"
    fields:
      next: "continue with the next sprint of the plan"
  - id: "post_tests_pass"
    kind: "code"
    title: "After: tests_pass"
    gate: "tests_pass"
    on_fail: "continue"
verdict:
  pass_if: "(sprints.ok) and post_tests_pass.ok"
  not_sure_if: "judge_cloud.unsure or judge_local.unsure"
based_on: "plan_local_build"
