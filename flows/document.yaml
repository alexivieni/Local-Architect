id: document
title: Document
kind: plan_execute_verify
blurb: "Find modules, functions and classes with no docstring -> write them from what the code actually does -> the same check proves fewer remain and nothing else changed."
produces: ["documented source files", "docs/documentation.md"]
uses_roles: [docs_writer]
budget: {calls: 22, tokens: 160000, seconds: 2000, heavy_calls: 1}
steps:
  - id: green
    kind: code
    title: "The existing tests pass before anything changes"
    gate: tests_green_before
    on_fail: stop

  - id: find
    kind: code
    title: "Find them, with code (the same check runs again afterwards)"
    gate: docs_scan
    on_fail: stop

  - id: fix
    kind: generate
    title: "Fix them, smallest change first (loop)"
    role: docs_writer
    tier: worker
    prompt: docstrings
    when: "find.findings > 0"
    vars: {findings: "{findings_text}", files: "{scope}"}
    context: {always: ["ctx:scope"], max_always: 4}
    verify: {gate: docs_fewer, run_tests: true}
    loop: {max: 3, coach: true, escalate: [heavy]}
    on_fail: continue
    budget: {tokens: 110000, seconds: 1300}

  - id: write
    kind: report
    title: "Write docs/documentation.md"
    path: docs/documentation.md
    label: document report
    template: |
      # Documentation

      Checked: {find.files} file(s)

      ## Found before: {find.findings}

      {findings_text}

      ## Left after the fix: {fix.after}

verdict:
  pass_if: "find.findings == 0 or fix.ok"
  not_sure_if: "find.unsure or fix.unsure"
