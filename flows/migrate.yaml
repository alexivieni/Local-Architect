id: migrate
title: Migrate
kind: plan_execute_verify
blurb: "Find every use of an old API (the quoted name in your request, or params.old) -> move each call site to the new one -> the same search proves fewer remain and the tests still pass."
produces: ["migrated source files", "docs/migration.md"]
uses_roles: [migration_engineer]
budget: {calls: 22, tokens: 160000, seconds: 2000, heavy_calls: 1}
steps:
  - id: green
    kind: code
    title: "The existing tests pass before anything changes"
    gate: tests_green_before
    on_fail: stop

  - id: find
    kind: code
    title: "Find them, with code (the same check runs again afterwards)"
    gate: migrate_scan
    on_fail: stop

  - id: fix
    kind: generate
    title: "Fix them, smallest change first (loop)"
    role: migration_engineer
    tier: worker
    prompt: migrate
    when: "find.findings > 0"
    vars: {findings: "{findings_text}", files: "{scope}"}
    context: {always: ["ctx:scope"], max_always: 4}
    verify: {gate: migrate_fewer, run_tests: true}
    loop: {max: 3, coach: true, escalate: [heavy]}
    on_fail: continue
    budget: {tokens: 110000, seconds: 1300}

  - id: write
    kind: report
    title: "Write docs/migration.md"
    path: docs/migration.md
    label: migrate report
    template: |
      # Migration

      Checked: {find.files} file(s)

      ## Found before: {find.findings}

      {findings_text}

      ## Left after the fix: {fix.after}

verdict:
  pass_if: "find.findings == 0 or fix.ok"
  not_sure_if: "find.unsure or fix.unsure"
