# Architect's full self-test run on GitHub's Windows machines, so it never needs the owner's laptop.
# The same commands the handoff checklist names (CLAUDE.md, "Before handing off"), each in a throwaway home and data folder.
# Nothing here calls a model or Claude: the suites use their scripted stand-ins (ARCHITECT_SELFTEST, arch_cloud.allowed()).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:                      # a newer push to the same branch replaces a run still going
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      ARCHITECT_NO_CACHE: "1"
    steps:
      # Windows runners convert line endings on checkout by default; the manifest and the byte-exact guarded-slice checks need the
      # files exactly as committed (.gitattributes says `* -text` too; this is the backstop).
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 2          # the line-ending check compares the commit with its parent

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pytest runs the suites; flask, fastapi, uvicorn and httpx are only what two project starters (flask_app, fastapi) need so that
      # arch_selftest_templates_catalog runs their full tests here instead of reporting "could not run" (checked: 64/64 with them)
      - name: Install pytest and the two starters' packages
        run: python -m pip install --disable-pip-version-check pytest flask fastapi uvicorn httpx

      - name: Throwaway home and data folder
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP "arch_home"; $d = Join-Path $env:RUNNER_TEMP "arch_data"
          New-Item -ItemType Directory -Force $h, $d | Out-Null
          "ARCHITECT_HOME=$h" >> $env:GITHUB_ENV
          "ARCHITECT_DATA_DIR=$d" >> $env:GITHUB_ENV

      # one step per check: in a multi-line PowerShell step only the LAST command's exit code would count
      - name: Flow files are valid
        run: python architect.py flows --validate
      - name: Stated counts match the code
        run: python tools/doc_counts.py
      - name: No new do-nothing error handlers
        run: python tools/swallow_audit.py
      - name: Lessons still enforced
        run: python arch_lessons.py
      - name: No fake code
        run: python architect.py fakecode
      - name: No file changed its line-ending style
        run: python tools/eol_audit.py --base HEAD~1
      - name: Manifest matches the tracked files
        run: python tools/ci_manifest_check.py

      # which suites failed only under load in the last runs: a suite that does it twice in ten runs is counted as a failure
      - name: Restore the load history
        uses: actions/cache/restore@v5
        with:
          path: .ci_history
          key: ci-load-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-load-history-

      # --must-run: this runner has Edge, so the two browser suites (the only real-browser checks of the hub's JavaScript) must run in
      # full; "could not run" is a failure here, not a quiet NOT_SURE
      - name: Every suite (tools/ci_parallel.py)
        shell: cmd
        run: |
          python tools/ci_parallel.py --jobs 4 --timeout 1200 --must-run uismoke,crawl --history .ci_history\load.json > "%RUNNER_TEMP%\ci_out.txt" 2>&1
          set rc=%ERRORLEVEL%
          type "%RUNNER_TEMP%\ci_out.txt"
          exit /b %rc%

      # the log is visible only to signed-in users; annotations and the job summary are public on a public repository
      - name: Report failing suites as annotations
        if: always()
        shell: cmd
        run: python tools/ci_annotate.py "%RUNNER_TEMP%\ci_out.txt"

      - name: Save the load history
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ci_history
          key: ci-load-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the suite table
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-report
          path: ${{ env.ARCHITECT_DATA_DIR }}/ci/*.json
          if-no-files-found: ignore

  # The same suites on Linux (Ubuntu ships `python3` and no `python`; paths and process groups work differently). Not asked to run the
  # two browser suites in full: no Linux browser has been checked, so they may say "could not run" here without making the job red.
  selftest-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      ARCHITECT_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest and the two starters' packages
        run: python -m pip install --disable-pip-version-check pytest flask fastapi uvicorn httpx

      - name: Throwaway home and data folder
        run: |
          mkdir -p "$RUNNER_TEMP/arch_home" "$RUNNER_TEMP/arch_data"
          echo "ARCHITECT_HOME=$RUNNER_TEMP/arch_home" >> "$GITHUB_ENV"
          echo "ARCHITECT_DATA_DIR=$RUNNER_TEMP/arch_data" >> "$GITHUB_ENV"

      # The job's log is visible only to signed-in users, so (as on Windows) the output is kept in a file and turned into public
      # annotations; the first runs of this job failed with only "exit code 1" to show for it.
      - name: Every suite (tools/ci_parallel.py)
        run: |
          python tools/ci_parallel.py --jobs 4 --timeout 1200 > "$RUNNER_TEMP/ci_out.txt" 2>&1; rc=$?
          cat "$RUNNER_TEMP/ci_out.txt"
          exit $rc

      - name: Report failing suites as annotations
        if: always()
        run: python tools/ci_annotate.py "$RUNNER_TEMP/ci_out.txt"

      - name: Keep the suite table
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-report-linux
          path: ${{ env.ARCHITECT_DATA_DIR }}/ci/*.json
          if-no-files-found: ignore
