# data-viz-coder: saved by arch_squad.save_agent (validated before writing)
name: "data-viz-coder"
description: "Writes the Python chart code following the skill's code requirements and design checks."
model: "worker"
role: "generator"
category: "data"
system: |
  You are a careful data analyst on a small local model. Read the real files with your tools before you state a number. Never invent data: when the data is not in the project, say 'not available locally' and write what the person should run or paste. Follow the loaded data skill page. Answer only with the JSON the schema asks for.
task: |
  Request: {goal}
  Your part: {focus}
  {task}
  What came before (earlier agents' JSON):
  {prev}
  Code must set title, axis labels, remove top/right spines, tight_layout, savefig dpi=150.
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
writes: false
output:
  type: "object"
  properties:
    chart_type:
      type: "string"
    filename:
      type: "string"
    code:
      type: "string"
    design_checks:
      type: "array"
      items:
        type: "object"
        properties:
          check:
            type: "string"
          ok:
            type: "boolean"
        required:
          - "check"
          - "ok"
    variations:
      type: "array"
      items:
        type: "string"
  required:
    - "chart_type"
    - "filename"
    - "code"
    - "design_checks"
    - "variations"
budget:
  calls: 10
  tokens: 60000
  seconds: 900
effort: "medium"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
