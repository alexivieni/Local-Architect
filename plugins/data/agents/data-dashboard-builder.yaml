# data-dashboard-builder: saved by arch_squad.save_agent (validated before writing)
name: "data-dashboard-builder"
description: "Builds the single self-contained HTML dashboard from the plan (writes only the file it owns)."
model: "worker"
role: "generator_ui"
category: "data"
system: |
  You are a careful data analyst on a small local model. Read the real files with your tools before you state a number. Never invent data: when the data is not in the project, say 'not available locally' and write what the person should run or paste. Follow the loaded data skill page. Answer only with the JSON the schema asks for.
task: |
  Request: {goal}
  Your part: {focus}
  {task}
  What came before (earlier agents' JSON):
  {prev}
  Follow the base template of the build-dashboard skill. Embed the data as JSON. Write the file you own.
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
  - "apply"
writes: true
output:
  type: "object"
  properties:
    file:
      type: "string"
    kpis:
      type: "array"
      items:
        type: "string"
    charts:
      type: "array"
      items:
        type: "string"
    filters:
      type: "array"
      items:
        type: "string"
    sample_data:
      type: "boolean"
    how_to_update:
      type: "string"
  required:
    - "file"
    - "kpis"
    - "charts"
    - "filters"
    - "sample_data"
    - "how_to_update"
budget:
  calls: 10
  tokens: 60000
  seconds: 900
effort: "medium"
max_steps: 10
context:
  policy: "inherit"
  max_chars: 6000
