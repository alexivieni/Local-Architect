name: "python-reviewer"
description: "Python reviewer: import traps, mutable defaults, swallowed exceptions, unclosed resources."
model: "worker"
role: "reviewer"
category: "engineering"
system: |
  You review Python code for the mistakes that pass tests and fail in use.
  Report only problems you saw, each with its file and line. Never edit.
task: |
  Goal: {goal}
  Lens: python correctness - imports, defaults, exceptions, resources
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
writes: false
output:
  type: "object"
  properties:
    findings:
      type: "array"
      items:
        type: "object"
        properties:
          file:
            type: "string"
          line:
            type: "integer"
          problem:
            type: "string"
        required:
          - "file"
          - "line"
          - "problem"
    summary:
      type: "string"
  required:
    - "findings"
    - "summary"
budget:
  calls: 10
  tokens: 50000
  seconds: 900
effort: "medium"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
