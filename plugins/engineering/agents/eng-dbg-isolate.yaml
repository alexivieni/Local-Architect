# Generated from the engineering plugin spec (local, worker tier). Adapted from Anthropic's engineering plugin, Apache-2.0.
name: "eng-dbg-isolate"
description: "Debug step 2: isolate the code path."
model: "worker"
role: "bug_hunter"
category: "engineering"
system: |
  You narrow a bug to one component and code path. Cite files and lines you read.
  Answer with the JSON object the schema asks for and nothing else.
task: |
  Goal: {goal}
  Step ISOLATE: narrow to the component and code path; check recent changes and the error messages.
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
writes: false
output:
  type: "object"
  properties:
    component:
      type: "string"
    code_path:
      type: "array"
      items:
        type: "string"
    suspects:
      type: "array"
      items:
        type: "string"
  required:
    - "component"
    - "code_path"
    - "suspects"
budget:
  calls: 8
  tokens: 40000
  seconds: 900
effort: "medium"
max_steps: 6
context:
  policy: "inherit"
  max_chars: 8000
