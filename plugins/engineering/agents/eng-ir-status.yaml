# Generated from the engineering plugin spec (local, worker tier). Adapted from Anthropic's engineering plugin, Apache-2.0.
name: "eng-ir-status"
description: "Incident: status update in the skill's format."
model: "worker"
role: "reliability_engineer"
category: "engineering"
system: |
  You write a factual incident status update: what is happening, who is affected, what we are doing, when the next update is. No speculation.
  Answer with the JSON object the schema asks for and nothing else.
task: |
  Goal: {goal}
  Write the status update.
  What came before:
  {prev}
  {task}
tools:
  - "read"
writes: false
output:
  type: "object"
  properties:
    title:
      type: "string"
    severity:
      type: "string"
      enum:
        - "SEV1"
        - "SEV2"
        - "SEV3"
        - "SEV4"
    status:
      type: "string"
      enum:
        - "Investigating"
        - "Identified"
        - "Monitoring"
        - "Resolved"
    impact:
      type: "string"
    last_updated:
      type: "string"
    current_status:
      type: "string"
    actions_taken:
      type: "array"
      items:
        type: "string"
    next_steps:
      type: "array"
      items:
        type: "string"
    timeline:
      type: "array"
      items:
        type: "object"
        properties:
          time:
            type: "string"
          event:
            type: "string"
        required:
          - "time"
          - "event"
  required:
    - "title"
    - "severity"
    - "status"
    - "impact"
    - "last_updated"
    - "current_status"
    - "actions_taken"
    - "next_steps"
    - "timeline"
budget:
  calls: 8
  tokens: 40000
  seconds: 900
effort: "low"
max_steps: 6
context:
  policy: "inherit"
  max_chars: 8000
