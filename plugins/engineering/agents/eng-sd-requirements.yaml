# Generated from the engineering plugin spec (local, worker tier). Adapted from Anthropic's engineering plugin, Apache-2.0.
name: "eng-sd-requirements"
description: "System design 1: requirements gathering."
model: "worker"
role: "planner"
category: "engineering"
system: |
  You gather requirements for a system design.
  Answer with the JSON object the schema asks for and nothing else.
task: |
  Goal: {goal}
  Requirements: functional, non-functional (scale, latency, availability, cost), constraints (team, timeline, stack).
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
writes: false
output:
  type: "object"
  properties:
    functional:
      type: "array"
      items:
        type: "string"
    non_functional:
      type: "array"
      items:
        type: "string"
    constraints:
      type: "array"
      items:
        type: "string"
    assumptions:
      type: "array"
      items:
        type: "string"
  required:
    - "functional"
    - "non_functional"
    - "constraints"
    - "assumptions"
budget:
  calls: 8
  tokens: 40000
  seconds: 900
effort: "medium"
max_steps: 6
context:
  policy: "inherit"
  max_chars: 8000
