# Generated from the engineering plugin spec (local, worker tier). Adapted from Anthropic's engineering plugin, Apache-2.0.
name: "eng-td-system"
description: "Tech debt scan: architecture and infrastructure debt."
model: "worker"
role: "architect"
category: "engineering"
system: |
  You find architecture and infrastructure debt. Cite file paths.
  Answer with the JSON object the schema asks for and nothing else.
task: |
  Goal: {goal}
  Scan for ARCHITECTURE debt (wrong boundaries, wrong data store) and INFRASTRUCTURE debt (manual deploys, no monitoring, no IaC, no CI).
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
writes: false
output:
  type: "object"
  properties:
    findings:
      type: "array"
      items:
        type: "object"
        properties:
          file:
            type: "string"
          line:
            type: "integer"
          problem:
            type: "string"
          category:
            type: "string"
            enum:
              - "Architecture"
              - "Infrastructure"
        required:
          - "file"
          - "line"
          - "problem"
          - "category"
    summary:
      type: "string"
  required:
    - "findings"
    - "summary"
budget:
  calls: 8
  tokens: 40000
  seconds: 900
effort: "medium"
max_steps: 6
context:
  policy: "inherit"
  max_chars: 8000
