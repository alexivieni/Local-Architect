    agent: "eng-standup"
    label: "standup"
returns:
  type: "object"
  properties:
    date:
      type: "string"
    yesterday:
      type: "array"
      items:
        type: "string"
    today:
      type: "array"
      items:
        type: "string"
    blockers:
      type: "array"
      items:
        type: "object"
        properties:
          blocker:
            type: "string"
          who_can_help:
            type: "string"
        required:
          - "blocker"
          - "who_can_help"
  required:
    - "date"
    - "yesterday"
    - "today"
    - "blockers"
