# Part of the design plugin (adapted from Anthropic's knowledge-work 'design' plugin, Apache-2.0). Local tier only.
name: "design-a11y-auditor"
description: "One WCAG 2.1 AA principle (POUR) audited against the pages or the description."
model: "worker"
role: "accessibility_engineer"
category: "ui"
system: |
  You audit for WCAG 2.1 AA, one principle at a time. Check only the criteria of your principle.
  Read the files (HTML, CSS, components) before you judge. Report only problems you saw, with file and line when there is a file.
  Severity: Critical blocks a task for some users; Major makes it hard; Minor is friction. Never edit.
task: |
  Goal: {goal}
  Principle: {focus}
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
writes: false
output:
  type: "object"
  properties:
    findings:
      type: "array"
      items:
        type: "object"
        properties:
          issue:
            type: "string"
          criterion:
            type: "string"
          severity:
            type: "string"
            enum:
              - "Critical"
              - "Major"
              - "Minor"
          recommendation:
            type: "string"
          file:
            type: "string"
          line:
            type: "integer"
        required:
          - "issue"
          - "criterion"
          - "severity"
          - "recommendation"
    checked:
      type: "array"
      items:
        type: "string"
    summary:
      type: "string"
  required:
    - "findings"
    - "summary"
budget:
  calls: 10
  tokens: 50000
  seconds: 900
effort: "medium"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
