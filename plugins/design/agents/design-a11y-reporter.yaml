# Part of the design plugin (adapted from Anthropic's knowledge-work 'design' plugin, Apache-2.0). Local tier only.
name: "design-a11y-reporter"
description: "Writes the accessibility audit in the skill's exact tables from the four principle audits."
model: "worker"
role: "docs_writer"
category: "ui"
system: |
  You merge four principle audits into one WCAG 2.1 AA report. Drop duplicates, keep each finding under its principle,
  count severities exactly, and fill the contrast, keyboard and screen-reader tables only from what the audits or files show.
  Ratios: use the WCAG formula (L1+0.05)/(L2+0.05); body text needs 4.5:1, large text and UI parts 3:1. Never invent colors.
task: |
  Goal: {goal}
  The four audits:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
writes: false
output:
  type: "object"
  properties:
    name:
      type: "string"
    standard:
      type: "string"
    date:
      type: "string"
    summary:
      type: "object"
      properties:
        issues:
          type: "integer"
        critical:
          type: "integer"
        major:
          type: "integer"
        minor:
          type: "integer"
      required:
        - "issues"
        - "critical"
        - "major"
        - "minor"
    perceivable:
      type: "array"
      items:
        type: "object"
        properties:
          issue:
            type: "string"
          criterion:
            type: "string"
          severity:
            type: "string"
            enum:
              - "Critical"
              - "Major"
              - "Minor"
          recommendation:
            type: "string"
        required:
          - "issue"
          - "criterion"
          - "severity"
          - "recommendation"
    operable:
      type: "array"
      items:
        type: "object"
        properties:
          issue:
            type: "string"
          criterion:
            type: "string"
          severity:
            type: "string"
            enum:
              - "Critical"
              - "Major"
              - "Minor"
          recommendation:
            type: "string"
        required:
          - "issue"
          - "criterion"
          - "severity"
          - "recommendation"
    understandable:
      type: "array"
      items:
        type: "object"
        properties:
          issue:
            type: "string"
          criterion:
            type: "string"
          severity:
            type: "string"
            enum:
              - "Critical"
              - "Major"
              - "Minor"
          recommendation:
            type: "string"
        required:
          - "issue"
          - "criterion"
          - "severity"
          - "recommendation"
    robust:
      type: "array"
      items:
        type: "object"
        properties:
          issue:
            type: "string"
          criterion:
            type: "string"
          severity:
            type: "string"
            enum:
              - "Critical"
              - "Major"
              - "Minor"
          recommendation:
            type: "string"
        required:
          - "issue"
          - "criterion"
          - "severity"
          - "recommendation"
    contrast:
      type: "array"
      items:
        type: "object"
        properties:
          element:
            type: "string"
          foreground:
            type: "string"
          background:
            type: "string"
          ratio:
            type: "string"
          required:
            type: "string"
          pass:
            type: "boolean"
        required:
          - "element"
          - "foreground"
          - "background"
          - "ratio"
          - "required"
          - "pass"
    keyboard:
      type: "array"
      items:
        type: "object"
        properties:
          element:
            type: "string"
          tab_order:
            type: "string"
          enter_space:
            type: "string"
          escape:
            type: "string"
          arrow_keys:
            type: "string"
        required:
          - "element"
          - "tab_order"
          - "enter_space"
          - "escape"
          - "arrow_keys"
    screen_reader:
      type: "array"
      items:
        type: "object"
        properties:
          element:
            type: "string"
          announced_as:
            type: "string"
          issue:
            type: "string"
        required:
          - "element"
          - "announced_as"
          - "issue"
    priority_fixes:
      type: "array"
      items:
        type: "object"
        properties:
          fix:
            type: "string"
          severity:
            type: "string"
            enum:
              - "Critical"
              - "Major"
              - "Minor"
          why:
            type: "string"
        required:
          - "fix"
          - "severity"
          - "why"
  required:
    - "name"
    - "standard"
    - "date"
    - "summary"
    - "perceivable"
    - "operable"
    - "understandable"
    - "robust"
    - "contrast"
    - "keyboard"
    - "screen_reader"
    - "priority_fixes"
budget:
  calls: 10
  tokens: 50000
  seconds: 900
effort: "medium"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
