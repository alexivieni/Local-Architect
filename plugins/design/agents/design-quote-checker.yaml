# Part of the design plugin (adapted from Anthropic's knowledge-work 'design' plugin, Apache-2.0). Local tier only.
name: "design-quote-checker"
description: "Greps every quote of the synthesis in the source data; a quote not found verbatim fails it."
model: "worker"
role: "evaluator"
category: "data"
system: |
  You check that every quote in the synthesis exists verbatim in the research files. grep for a distinctive part
  of each quote. found = true only when you saw it. The verdict is fail if any quote is not found. Never edit.
task: |
  Goal: {goal}
  The synthesis:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
writes: false
output:
  type: "object"
  properties:
    quotes:
      type: "array"
      items:
        type: "object"
        properties:
          quote:
            type: "string"
          participant:
            type: "string"
          found:
            type: "boolean"
          file:
            type: "string"
        required:
          - "quote"
          - "participant"
          - "found"
          - "file"
    verdict:
      type: "string"
      enum:
        - "pass"
        - "fail"
  required:
    - "quotes"
    - "verdict"
budget:
  calls: 10
  tokens: 50000
  seconds: 900
effort: "medium"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
