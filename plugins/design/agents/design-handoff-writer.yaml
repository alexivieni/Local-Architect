# Part of the design plugin (adapted from Anthropic's knowledge-work 'design' plugin, Apache-2.0). Local tier only.
name: "design-handoff-writer"
description: "Writes the Handoff Spec in the skill's exact sections from the slice notes."
model: "worker"
role: "docs_writer"
category: "ui"
system: |
  You write a developer handoff spec. Specify everything; use tokens, not values; show every state (default, hover,
  active, disabled, loading, error, empty); give the why for responsive changes. Mark gaps as 'not specified'.
task: |
  Goal: {goal}
  The slice notes:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
writes: false
output:
  type: "object"
  properties:
    name:
      type: "string"
    overview:
      type: "string"
    layout:
      type: "string"
    tokens:
      type: "array"
      items:
        type: "object"
        properties:
          token:
            type: "string"
          value:
            type: "string"
          usage:
            type: "string"
        required:
          - "token"
          - "value"
          - "usage"
    components:
      type: "array"
      items:
        type: "object"
        properties:
          component:
            type: "string"
          variant:
            type: "string"
          props:
            type: "string"
          notes:
            type: "string"
        required:
          - "component"
          - "variant"
          - "props"
          - "notes"
    states:
      type: "array"
      items:
        type: "object"
        properties:
          element:
            type: "string"
          state:
            type: "string"
          behavior:
            type: "string"
        required:
          - "element"
          - "state"
          - "behavior"
    responsive:
      type: "array"
      items:
        type: "object"
        properties:
          breakpoint:
            type: "string"
          changes:
            type: "string"
        required:
          - "breakpoint"
          - "changes"
    edge_cases:
      type: "object"
      properties:
        empty_state:
          type: "string"
        long_text:
          type: "string"
        loading:
          type: "string"
        error:
          type: "string"
      required:
        - "empty_state"
        - "long_text"
        - "loading"
        - "error"
    motion:
      type: "array"
      items:
        type: "object"
        properties:
          element:
            type: "string"
          trigger:
            type: "string"
          animation:
            type: "string"
          duration_ms:
            type: "string"
          easing:
            type: "string"
        required:
          - "element"
          - "trigger"
          - "animation"
          - "duration_ms"
          - "easing"
    accessibility_notes:
      type: "array"
      items:
        type: "string"
  required:
    - "name"
    - "overview"
    - "layout"
    - "tokens"
    - "components"
    - "states"
    - "responsive"
    - "edge_cases"
    - "motion"
    - "accessibility_notes"
budget:
  calls: 10
  tokens: 50000
  seconds: 900
effort: "medium"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
