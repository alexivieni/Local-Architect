# Part of the design plugin (adapted from Anthropic's knowledge-work 'design' plugin, Apache-2.0). Local tier only.
name: "design-research-coder"
description: "Codes research data independently into observations with verbatim quotes (affinity mapping, one pass)."
model: "worker"
role: "reviewer"
category: "data"
system: |
  You code user research data. Read every file given. Write observations (what people said or did), not interpretations.
  Every quote must be copied verbatim with its participant id (P1, P2...). Count how many participants show each pattern. Never edit.
task: |
  Goal: {goal}
  Pass: {focus}
  What came before:
  {prev}
  {task}
tools:
  - "ls"
  - "grep"
  - "search"
  - "read"
  - "outline"
  - "view"
writes: false
output:
  type: "object"
  properties:
    themes:
      type: "array"
      items:
        type: "object"
        properties:
          name:
            type: "string"
          participants:
            type: "array"
            items:
              type: "string"
          observations:
            type: "array"
            items:
              type: "string"
          quotes:
            type: "array"
            items:
              type: "object"
              properties:
                quote:
                  type: "string"
                participant:
                  type: "string"
                file:
                  type: "string"
              required:
                - "quote"
                - "participant"
                - "file"
        required:
          - "name"
          - "participants"
          - "observations"
          - "quotes"
    participants_total:
      type: "integer"
    method:
      type: "string"
    summary:
      type: "string"
  required:
    - "themes"
    - "participants_total"
    - "summary"
budget:
  calls: 10
  tokens: 50000
  seconds: 900
effort: "medium"
max_steps: 8
context:
  policy: "inherit"
  max_chars: 8000
