/* ===================================================================================================
   CALM LAYER (UX review 2026-11-04). The last word on the shared look, so every page reads as one app:
   one card, one radius pair, one spacing scale, one primary button, AA text in both themes, one accent
   plus the orange that means Claude, and boxes that scroll inside themselves.
   Scale: space 4 8 12 16 24 | radius --r 12 (cards, panels) / --rs 8 (controls, inner boxes, rows)
   Type:  page 26 / card 17 / sub-step 15 / body 14-15 / small 12.5 / label 11 caps
   =================================================================================================== */
/* (the scale and the AA colours this layer introduced are in the token block at the top) */
body{overflow-x:clip}

/* one card: solid hairline, the same radius and padding everywhere; the corner ticks read as a broken (dashed) edge, so they go */
.card,.thread,.doing,.tiercard,.fm-card,.rv,.tcard,.mm-card,.bp-ed,.sdetail{border:1px solid var(--line);border-radius:var(--r)}
.card::after,.thread::after,.doing::after,.tiercard::after{content:none}
.card{padding:18px 20px;margin-bottom:var(--s4)}
.sflow{padding:20px 22px}
.fm-card{padding:16px 18px}
.grid,.tiergrid,.tgal,.mm-grid,.btiles{gap:var(--s4)}
.starts button,.starts button:hover,.ccthink,.bp-card.foreign,.crew .more{border-style:solid}
.ccthink{background:var(--soft)}
.bp-canvas{border:1px solid var(--line)}
.bp-canvas.dropping{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
/* only things you can click react to the pointer; a plain card stays still */
.card:not([role=button]):hover{box-shadow:var(--shadow);border-color:var(--line);transform:none}
/* inner boxes and rows share the small radius */
.btn,input,select,textarea,.rec,.qlist li,.swork,.crew-item,.saitem,.reqs,.mmbtn,.livetxt,.swtext,.cctool,.ccthink,.ccfinal,.note,pre.cmd,.term{border-radius:var(--rs)}
.qadd input,.qadd select,.tc-pick select{border-radius:var(--rs)}

/* type scale */
.top h1{font:650 var(--t-2xl)/1.15 var(--font-head);letter-spacing:-.4px}
.top p{font-size:var(--t-s);max-width:72ch}
.card h2,.mm-top h2,.teamhead h2{font:650 17px/1.3 var(--font-head);letter-spacing:-.1px}
.bp-ed h3,.tcard h3,.sstep-h h3,.rcard h3{font:650 15px/1.3 var(--font-head)}
.card>h3,.sdetail h4,.section-head b{font:650 12.5px/1.3 var(--font);color:var(--mute);letter-spacing:.02em;text-transform:none}
.sub,.tc-what,.setupcard p{color:var(--mute);font-size:.8438rem;line-height:1.55}
.small,.qlist .meta,.msg .meta,label.f{font-size:.7812rem}
label.f .hint,.composer .hint{font-size:.75rem}
/* figures line up */
.num,td.n,th.n,.cell,.chip,.btile b,.qstats b,.hwpills b,.vram .legend,.crew-bar .num,.lane,.qlist .meta,.strip,.gates .v,.mm-model{font-variant-numeric:tabular-nums}

/* one button hierarchy: filled primary (.p and .pri are the same thing), quiet secondary, red text for danger */
.btn{min-height:34px;padding:6px 14px;font-weight:500}
.bp-arrows .btn{min-height:26px}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.8125rem}
.btn.p,.btn.pri{background:var(--acc);color:var(--on-acc);border-color:transparent;font-weight:600;font-family:var(--font);letter-spacing:0;
  box-shadow:0 6px 18px -10px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn.p:hover:not(:disabled),.btn.pri:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 86%,var(--ink));border-color:transparent}
.btn.danger{color:var(--bad)}.btn.danger:hover:not(:disabled){border-color:var(--bad)}
.sheet .btn.p{color:var(--bp);background:#fff}

/* inputs fill the space a label gives them */
label.f.grow>input,label.f.grow>select,label.f.grow>textarea,.fgrid label.f>input,.fgrid label.f>select{width:100%}
#goal{min-height:110px;resize:vertical}

/* one accent; the orange means Claude and nothing else */
.lane-b.router{background:var(--faint)}.lane-b.heavy{background:var(--llm)}.lane-b.cloud{background:var(--claude)}
.crew-bar .bar>i{background:var(--claude)}
.usebtn.on:last-child,.cbadge{background:var(--claude-bg);color:var(--claude-ink)}
.msg.claude .who,.agev.agent-message .agico{background:var(--claude-bg);color:var(--claude-ink)}
.ccmsg .ccbul{color:var(--claude-ink)}
.mpick.cl{border-color:var(--claude);color:var(--claude-ink);background:var(--claude-bg)}
.mmbtn.cl{border-color:color-mix(in srgb,var(--claude) 60%,transparent);color:var(--claude-ink)}.mmbtn.cl .mmdot{background:var(--claude)}

/* boxes that fill up: long content scrolls inside the box, and an empty box says what to do */
.term{height:auto;min-height:180px;max-height:min(60vh,560px)}
.msg.job .term{min-height:0;height:160px}
.term:empty::before{content:"Nothing running yet. Press Start and the output appears here, line by line.";color:color-mix(in srgb,var(--term-ink) 60%,transparent);font-family:var(--font)}
.boxlist{max-height:420px;overflow:auto}
.qlist{max-height:min(62vh,640px);overflow:auto;padding-right:2px}
.crew-sched{max-height:360px;overflow:auto}
.sd-files,.livetxt,.swtext{overscroll-behavior:contain}
.empty,.bp-empty,.idle{color:var(--mute)}
.empty{padding:28px 16px;border-radius:var(--rs);background:color-mix(in srgb,var(--soft) 55%,transparent)}

/* New task: the request on the left, what happens on the right -- no dead half of the page */
.runlay{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,1fr);gap:var(--s4);align-items:start}
.runlay .term-card{position:static}
.runmain>.card:last-child,.runside>.card:last-child{margin-bottom:0}
.runlay #examples{gap:6px}
@media (max-width:1100px){.runlay{grid-template-columns:minmax(0,1fr)}}

/* shortcuts panel */
.keylist{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 16px;margin:18px 0 0;align-items:baseline}
.keylist dt{white-space:nowrap;color:var(--mute);font-size:.75rem}.keylist dd{margin:0;font-size:.875rem}
#keysBtn kbd{margin-left:4px;padding:0 5px}

/* focus is always visible, never only a colour change */
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* the page arrives gently; with reduced motion it simply appears */
#view{animation:viewIn .18s var(--ease,ease-out)}

/* phone (375 px): nothing wider than the screen, every tap target at least 36 px */
@media (max-width:820px),(pointer:coarse){
  .btn,.btn.sm,.nav,aside .nav,.subtabs button,.tfilter button,.usebtn,.mmbtn,.mpick,.rv-tog,.helpq,
  input:not([type=checkbox]):not([type=radio]):not([type=range]),select{min-height:36px}
  .helpq{width:36px}
  input[type=checkbox],input[type=radio]{width:20px;height:20px}
  label.sw{min-height:36px}
  .palette li,.slash li{min-height:40px}
}
@media (max-width:600px){
  main{padding:14px 12px 48px}
  .card{padding:14px 14px}
  .top h1{font-size:1.375rem}
  .strip{gap:6px 12px}.strip .sep{display:none}
  .composer{grid-template-columns:minmax(0,1fr)}.composer>.btn,.composer>.mmbtn{justify-self:stretch}
  .runlay .row[style*="nowrap"]{flex-wrap:wrap!important;margin-left:0!important}
  .mmside{width:min(300px,92vw)}
  .keylist{grid-template-columns:minmax(0,1fr)}.keylist dd{margin-bottom:6px}
  table{font-size:.7812rem}
}
/* ===== 2026-11-04: the agents' workspace -- Fleet, Map, Logbook, Library, Monitor, the price of a Claude message ===== */
.ws-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:var(--s2);margin:var(--s2) 0 var(--s3)}
.ws-stat{border:1px solid var(--line);border-radius:var(--rs);padding:8px 12px;background:var(--bg);min-width:0}
.ws-stat b{display:block;font:650 19px/1.2 var(--font-head);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.ws-stat span{font-size:.75rem;color:var(--mute)}
.ws-list{display:grid;gap:var(--s2)}
.ws-item{border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;background:var(--panel);min-width:0}
.ws-item.conf{border-color:var(--bad);background:var(--badbg)}.ws-item.click{cursor:pointer}.ws-item.click:hover{border-color:var(--acc)}
.ws-item.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.ws-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.7812rem;color:var(--mute);margin-top:4px}.ws-meta b{color:var(--ink);font-weight:600}
.ws-pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;margin:6px 0 0;max-height:260px;overflow:auto}
.ws-scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--rs)}
.ws-tl{list-style:none;margin:0;padding:0}.ws-tl li{display:grid;grid-template-columns:64px minmax(0,140px) minmax(0,1fr);gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:.7812rem}
.ws-tl li:last-child{border-bottom:0}.ws-tl .k-conflict{background:var(--badbg)}.ws-tl .k-stall{background:var(--warnbg)}.ws-tl time{color:var(--faint);font-variant-numeric:tabular-nums}
.ws-tl .ag{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-md h1,.ws-md h2,.ws-md h3{font:650 16px/1.3 var(--font-head);margin:16px 0 6px}.ws-md h1{font-size:1.1875rem}.ws-md p{margin:6px 0}.ws-md ul{margin:6px 0;padding-left:20px}.ws-md li{margin:3px 0}
.ws-md pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px}
.ws-split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:var(--s4);align-items:start}
@media (max-width:860px){.ws-split{grid-template-columns:minmax(0,1fr)}}
/* the Fleet table: one row per agent, fields side by side on a wide screen, stacked on a phone */
.fl-row{display:grid;grid-template-columns:minmax(0,140px) 110px minmax(0,1.6fr) minmax(0,1fr) 90px 34px;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.fl-row.head{font-size:.75rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-top:0}
.fl-row input,.fl-row select,.fl-row textarea{width:100%;font:inherit;min-width:0}.fl-row textarea{resize:vertical}
.fl-row .flx{padding:4px 0;min-height:34px;width:34px}
.fl-lbl{display:none;font-size:.75rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
@media (max-width:760px){.fl-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fl-row.head{display:none}.fl-row .wide{grid-column:1/-1}.fl-lbl{display:block}.fl-row .flx{width:auto}}
.fl-agent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.fl-last{font-size:.7812rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1/-1}
/* the Map */
.mp-wrap{position:relative;overflow:auto;border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(var(--grid,transparent) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,var(--grid,transparent) 1px,transparent 1px) 0 0/20px 20px,var(--bg);max-height:72vh}
.mp-svg{display:block}
.mp-svg text{font-family:var(--font);fill:var(--ink);pointer-events:none}.mp-svg .mp-s{font-size:.75rem;fill:var(--mute)}.mp-svg .mp-t{font-size:.7812rem;font-weight:650}
.mp-n{cursor:grab;touch-action:none;outline:none}.mp-n.drag{cursor:grabbing}
.mp-n rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.mp-n .mp-band{stroke:none}
.mp-n:hover rect.mp-box,.mp-n:focus-visible rect.mp-box{stroke:var(--acc)}.mp-n.sel rect.mp-box{stroke:var(--acc);stroke-width:2.5}
.mp-n.t-request .mp-band{fill:var(--acc)}.mp-n.t-step .mp-band{fill:var(--llm)}.mp-n.t-agent .mp-band{fill:var(--info,var(--acc))}
.mp-n.t-tier .mp-band{fill:var(--infra)}.mp-n.t-claude .mp-band{fill:var(--claude)}.mp-n.t-tool .mp-band{fill:var(--judge)}
.mp-n.t-file .mp-band{fill:var(--faint)}.mp-n.t-check .mp-band{fill:var(--code)}.mp-n.t-verdict .mp-band{fill:var(--ink)}
.mp-n.ok-true rect.mp-box{stroke:var(--good)}.mp-n.ok-false rect.mp-box{stroke:var(--bad);fill:var(--badbg)}.mp-n.ok-null rect.mp-box{stroke:var(--warn)}
.mp-e{fill:none;stroke:var(--line);stroke-width:1.8}.mp-e.hi{stroke:var(--acc);stroke-width:2.4}.mp-mk{fill:var(--faint)}
.mp-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.75rem;color:var(--mute);margin:8px 0 0}.mp-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mp-detail{margin-top:var(--s3)}.mp-detail dl{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:4px 12px;margin:8px 0 0;font-size:.8125rem}.mp-detail dt{color:var(--mute)}.mp-detail dd{margin:0;overflow-wrap:anywhere}
@media (max-width:480px){.mp-detail dl{grid-template-columns:minmax(0,1fr)}.mp-detail dd{margin-bottom:6px}.ws-tl li{grid-template-columns:52px minmax(0,1fr)}.ws-tl li .dt{grid-column:1/-1}}
/* the price of a Claude message, under the composer */
.tokcost{font-size:.75rem;color:var(--claude-ink);background:var(--claude-bg);border-radius:99px;padding:1px 10px;white-space:normal}
/* ===== First visit: the guided path (fv-*) and the one-time page notes (pghint) ===== */
.fv-wrap{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(2px);display:grid;place-items:center;padding:12px;animation:toastIn .18s ease-out}
.fv{width:min(640px,100%);max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--modal);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.fv-top{display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--mute);letter-spacing:.03em;text-transform:uppercase}
.fv-dots{display:flex;gap:6px;margin-left:auto}.fv-dots i{width:22px;height:5px;border-radius:99px;background:var(--soft)}.fv-dots i.on{background:var(--acc)}.fv-dots i.done{background:color-mix(in srgb,var(--acc) 45%,var(--soft))}
.fv h2{margin:0;font:650 21px/1.25 var(--font-head)}.fv p{margin:0;line-height:1.55}.fv .lede{color:var(--mute);font-size:.875rem}
.fv-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.fv-list li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:var(--rs);background:var(--soft);font-size:.8438rem}
.fv-list li .tick{width:22px;height:22px}.fv-list li.bad .tick{background:var(--badbg);color:var(--bad)}.fv-list li.adv .tick{background:var(--warnbg);color:var(--warn)}
.fv-list li small{display:block;color:var(--mute);font-size:.7812rem;overflow-wrap:anywhere}
.fv-tier{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rs)}
.fv-tier b{font-size:.875rem}.fv-tier .m{font:500 12.5px var(--mono);color:var(--ink);overflow-wrap:anywhere;text-align:right}.fv-tier p{grid-column:1/-1;font-size:.8125rem;color:var(--mute)}
.fv-files{display:flex;gap:6px;flex-wrap:wrap}.fv-files code{background:var(--soft);padding:2px 8px;border-radius:6px;font-size:.7812rem}
.fv-verdict{padding:12px 14px;border-radius:var(--rs);font-weight:600}.fv-verdict.pass{background:var(--goodbg);color:var(--good)}.fv-verdict.fail{background:var(--badbg);color:var(--bad)}.fv-verdict.unsure,.fv-verdict.wait{background:var(--warnbg);color:var(--warn)}
.fv-verdict span{display:block;font-weight:400;font-size:.8125rem;margin-top:3px;color:var(--ink)}
.fv-next{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fv-next button{text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rs);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.fv-next button:hover,.fv-next button:focus-visible{border-color:var(--acc);background:var(--acc2)}.fv-next small{display:block;color:var(--mute);font-size:.7812rem;margin-top:2px}
.fv-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}.fv-foot .grow{flex:1}
.fv-dock{margin:0 0 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--rs);padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fv-dock .t{flex:1;min-width:0;font-size:.8438rem}.fv-dock .t b{display:block}.fv-dock .t span{color:var(--mute);font-size:.7812rem;overflow-wrap:anywhere}
.pghint{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;padding:10px 14px;border-radius:var(--rs);background:var(--infobg);color:var(--ink);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);font-size:.8438rem;line-height:1.5}
.pghint .ic{color:var(--info);flex:none;margin-top:2px}.pghint .t{flex:1;min-width:0}.pghint b{display:block;color:var(--info)}.pghint .acts{display:flex;gap:6px;flex-wrap:wrap;flex:none}
@media (max-width:600px){.fv{padding:16px}.fv h2{font-size:1.125rem}.fv-next{grid-template-columns:minmax(0,1fr)}.fv-foot .btn{flex:1 1 auto}.pghint{flex-wrap:wrap}.pghint .acts{width:100%}}

/* =====================================================================================================
   FLAGSHIP LAYER (2026-11-04). The pages added today (Council, Crew, Blueprints, Fleet, Map, Monitor, Logbook, Library, the
   first visit) arrived with their own small habits. This is the one set of rules every page now follows:
   Faces:   display face (--font-head) for titles and big figures ONLY; the text face (--font) for everything else,
            navigation, pills, buttons, labels, numbers in running text.
   Weights: 400 body, 500 controls, 600 labels and emphasis, 650 titles. Nothing heavier.
   Tracking: titles -0.01em, body 0, tiny capital labels 0.08em; capitals only below 12 px.
   Colour:  one accent; --claude orange only where Claude is involved.
   ===================================================================================================== */

/* ---- faces and weights ---- */
.top h1,.card h2,.card>h3,.sheet h1,.fv h2,.hdrawer h2,.mm-top h2,.teamhead h2,.tc-head b,.setupcard b,.idle.hero .lead,
.tcard h3,.bp-ed h3,.sstep-h h3,.rcard h3,.ws-md h1,.ws-md h2,.ws-md h3,.ws-stat b,.btile b{font-family:var(--font-head)}
.nav,.subtabs button,.tfilter button,.btn,.btn.pri,.strip,.strip b,.num,.meter+span,.qstats b,.k b,.vram .legend,.msg .meta,
.doing h3,.lbl,.doing .lbl,.tcard .plate .cat,.tcard .plate .no,.rv-tog b,.gs-step .tick,.msg .who,.brand .sub,.blueprint-art text{font-family:var(--font)}
.top h1{font-weight:650;letter-spacing:-.01em}
.card h2,.mm-top h2,.teamhead h2,.fv h2,.hdrawer h2{font-weight:650;letter-spacing:-.01em}
.btile b,.ws-stat b{font-weight:650;letter-spacing:-.01em}
.ava,.sstep-n,.bp-n,.stl-n,.tick,.msg.claude .who,.agev.agent-message .agico,.mhead .name,.helpq,.ccmsg .ccbul{font-weight:650}
.btn{font-weight:500;letter-spacing:0}.btn.p,.btn.pri{font-weight:600}
th{font-weight:600}
/* the wordmark reads as a name, not a shout */
.brand>span:nth-child(2){font:650 17px/1 var(--font-head);letter-spacing:-.01em;text-transform:none}
/* tiny capital labels: one size band and one tracking */
.lbl,.doing .lbl,.doing h3,.bp-pal .lbl,.crew-models .lbl,.fl-row.head,.fl-lbl,.tcard .plate .cat,.fv-top,.msg .who,.brand .sub{letter-spacing:.08em}
.doing h3,.fv-top{font-size:.75rem}
.sdetail h4,.formsec>h4{text-transform:none}

/* ---- the side bar tabs and the sub-tab pills: one height, one active state, they scroll instead of wrapping ---- */
.nav{min-height:38px;font-weight:500}
.nav[aria-current=page]{font-weight:600}
.subtabs,.tfilter{position:relative;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scroll-snap-type:x proximity;
  gap:6px;padding:2px 2px 6px;margin-left:-2px;margin-right:-2px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.subtabs::-webkit-scrollbar,.tfilter::-webkit-scrollbar{height:4px}
.subtabs button,.tfilter button{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;
  border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-size:.8125rem;font-weight:500;letter-spacing:0;white-space:nowrap;cursor:pointer}
.subtabs button:hover,.tfilter button:hover{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.subtabs button[aria-current=page],.tfilter button[aria-pressed=true]{background:var(--acc2);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent);font-weight:600}
.subtabs button:focus-visible,.tfilter button:focus-visible{outline-offset:1px}

/* ---- card headers: title and one line of help on the left, actions on the right, aligned to the title ---- */
.card>.row:first-child:has(>h2){align-items:center;gap:8px 10px;margin-bottom:8px}
.card>.row:first-child:has(>.grow>h2){align-items:flex-start;gap:8px 10px;margin-bottom:12px}
.card>.row:first-child>h2,.card>.row:first-child>.grow>h2{margin:0}
.card>.row:first-child>.grow>h2+.sub{margin:3px 0 0}
.card>.row:first-child>.btn,.card>.row:first-child>.chip{flex:none}
.card>h2+.sub{margin-top:2px}
.chead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 12px;margin:0 0 12px}
.chead>.t{flex:1 1 240px;min-width:0}.chead h2{margin:0}.chead .sub{margin:3px 0 0}
.chead>.acts{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}

/* ---- forms: labels above inputs, aligned grids, sensible widths ---- */
label.f{font-weight:500;color:var(--mute);min-width:0}
label.f>input:not([type=checkbox]):not([type=radio]):not([type=number]),label.f>select,label.f>textarea{width:100%}
label.f>.hint,.formsec .hint{font-weight:400;color:var(--faint);font-size:.75rem;margin:0}
.fgrid{grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:12px 16px;align-items:start}
.fgrid>.span-all,.fgrid>.span-2{grid-column:1/-1}
.fgrid>.span-wide{grid-column:span 2}
@media (max-width:700px){.fgrid>.span-wide{grid-column:1/-1}}
::placeholder{color:var(--faint);opacity:1}
details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.adv>summary,details.adv-sub>summary{cursor:pointer;color:var(--mute);font-size:.8125rem;font-weight:500;padding:4px 0}
details.adv>summary:hover,details.adv-sub>summary:hover{color:var(--ink)}
.formsec{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
details.adv>.formsec:first-of-type{border-top:0;padding-top:4px}
.formsec>h4{margin:0 0 8px;font:600 13px/1.3 var(--font);color:var(--ink);letter-spacing:0}
.formsec>.hint{margin:-4px 0 8px}
.fsub{margin:12px 0 6px;font-size:.7812rem;font-weight:500;color:var(--mute)}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:4px 16px}
.checkgrid label.sw{min-height:32px;font-size:.8438rem;color:var(--ink);align-items:center}
label.sw>input[type=checkbox],label.sw>input[type=radio]{flex:none;margin:0;accent-color:var(--acc)}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--acc)}

/* ---- action tiles (Projects > Home): one shape, the icon in a soft square ---- */
.btn.atile{text-align:left;padding:14px;display:flex;gap:12px;align-items:flex-start;white-space:normal;line-height:1.4;height:100%}
.btn.atile b{display:block;font-weight:600;margin-bottom:2px}
.ava .ic{width:18px;height:18px}

/* ---- states: loading, error, empty (tagged by markState, so every page looks the same) ---- */
.st-load{color:var(--mute)}
.st-load::before{content:"";display:inline-block;width:.85em;height:.85em;margin-right:.55em;vertical-align:-.12em;border-radius:50%;
  border:2px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:var(--acc);animation:stSpin .8s linear infinite}
@keyframes stSpin{to{transform:rotate(360deg)}}
.st-err{color:var(--bad)}
.st-err::before{content:"!";display:inline-grid;place-items:center;width:1.25em;height:1.25em;margin-right:.5em;border-radius:50%;
  background:var(--badbg);color:var(--bad);font:700 12px/1 var(--font);vertical-align:.05em}
div.st-err,p.st-err{background:var(--badbg);border-radius:var(--rs);padding:9px 12px}
div.st-err::before,p.st-err::before{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.st-empty{display:block;text-align:center;color:var(--mute);padding:22px 16px;border:1px solid var(--line);border-radius:var(--rs);
  background:color-mix(in srgb,var(--soft) 50%,transparent);font-size:.8438rem}
.empty,.bp-empty,.idle{font-size:.8438rem}

/* ---- the model menu follows the theme instead of always being dark; its accent is the app's, the toggle's orange is Claude's ---- */
.mmenu,.mmside{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:0 18px 50px -12px color-mix(in srgb,var(--ink) 35%,transparent)}
.mmhead,.mmsub,.mmdesc,.mmkey,.mmval,.mmchev2,.mmhelp{color:var(--mute)}
.mmrow:hover,.mmsubrow{background:var(--soft)}
.mmsep{background:var(--line)}
.mmcheck{color:var(--acc)}
.mmtag{border-color:var(--line);color:var(--mute)}.mmtag.warn{background:var(--warnbg);color:var(--warn)}
.mmtoggle{background:var(--line)}.mmtoggle.on{background:var(--claude)}
.mmbtn{border-radius:var(--rs)}

/* ---- one accent: the colours that looked like Claude's orange elsewhere move away from it ---- */
/* (--judge moved off Claude's orange: the token block holds it) */
.pins li.no i{background:var(--bp-no);border-color:var(--bp-no)}
.tcard .sel,.starts button .ic{color:var(--acc)}

/* ---- small screens (375 px): the side bar becomes one scrolling row of tabs, nothing wraps into a second toolbar ---- */
@media (max-width:820px){
  .card>.row:first-child>.btn{margin-left:0}
}
@media (max-width:600px){
  .top{gap:8px}.top p{font-size:.8125rem}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .checkgrid{grid-template-columns:minmax(0,1fr)}
  .chead>.acts{margin-left:0;width:100%}
  .card h2{font-size:1rem}
  .btile b{font-size:1.375rem}
}
/* recommendations on Settings */
.reccard{border-left:3px solid var(--acc)}.reccard.ok{border-left-color:var(--good)}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--good);flex:none}.recdot.warn{background:var(--acc)}
.reclist{margin:10px 0 0;padding-left:18px;display:grid;gap:4px;font-size:.8125rem}
.recline{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px}
.recchip{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--acc2);color:var(--acc)}
label.f.hasrec>input,label.f.hasrec>select{border-color:var(--acc)}

/* sharpen, why, live chip, drop target */
.sharp{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:var(--rs);display:grid;gap:8px}
.whylist{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:.8125rem}
.livechip{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.subtabs button.dropok{outline:2px dashed var(--acc);outline-offset:2px}

/* Simple mode */
.sp{padding:28px}.sp-title{font-size:1.6rem;margin:0 0 6px}.sp-sub{font-size:1rem;line-height:1.55;color:var(--mute);margin:0 0 16px;max-width:62ch}
.sp-recipes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sp-recipe{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer}
.sp-recipe:hover{border-color:var(--acc)}
.sp-goal{width:100%;font:inherit;font-size:1.05rem;line-height:1.5;padding:14px 16px;border-radius:var(--rs);border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sp-more{margin:12px 0}.sp-more summary{cursor:pointer;min-height:36px;display:flex;align-items:center;gap:6px}.sp-folder{color:var(--mute);font-family:var(--mono);font-size:.9rem}
.sp-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.sp-go{min-height:46px;padding:0 28px;font-size:1.05rem}
.sp-progress{padding:22px 28px}.sp-idle{color:var(--mute);margin:0}.sp-h{margin:0 0 10px}
.sp-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sp-step{display:flex;align-items:center;gap:12px;font-size:1.02rem}
.sp-ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);flex:none}
.sp-step.done .sp-ico{border-color:var(--good);color:var(--good)}.sp-step.fail .sp-ico{border-color:var(--bad);color:var(--bad)}
.sp-step.now .sp-ico{border-color:var(--acc);color:var(--acc)}.sp-step.unsure .sp-ico{border-color:var(--warn);color:var(--warn)}
.sp-result{margin-top:16px;padding:16px;border-radius:var(--rs);border:1px solid var(--line)}.sp-result.pass{border-color:var(--good)}.sp-result.fail{border-color:var(--bad)}
/* accessibility */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:8px;top:-60px;z-index:1000;padding:10px 16px;border-radius:8px;background:var(--acc);color:var(--bg);font-weight:700}
.skip-link:focus{top:8px}
/* the one focus ring (audit 27): every focusable part uses it; components only change the offset */
:focus-visible{outline:3px solid var(--acc)!important;outline-offset:2px!important}
:focus:not(:focus-visible){outline:none}
button,select,input,textarea,summary{min-height:36px}

/* Blueprints, plain language */
.bp-recipes{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 14px}.bp-desc{font-size:.82rem;color:var(--mute);line-height:1.3}

/* "What's inside" inspector */
.fi-overlay{position:fixed;inset:0;z-index:200;background:color-mix(in srgb,var(--bg) 78%,transparent);display:grid;place-items:start center;overflow:auto;padding:4vh 12px}
.fi-panel{width:min(860px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px}
.fi-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.fi-facts>div{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px}
.fi-step{border:1px solid var(--line);border-radius:10px;padding:10px 14px}.fi-step>summary{cursor:pointer;display:flex;align-items:center;gap:10px}
.fi-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--acc2);color:var(--acc);font-size:.75rem;font-weight:700;flex:none}
.fi-dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:10px 0 4px}.fi-dl dt{color:var(--mute)}.fi-dl dd{margin:0}
.fi-prompt pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--bg);padding:10px;border-radius:8px;font-size:.7812rem}

.fi-custom{border-top:1px solid var(--line);padding-top:10px}.fi-custom>summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.fi-edit{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.fi-edit .f{min-width:120px}

/* Gallery + Computers */
.gal-q{width:100%;margin-top:6px;min-height:42px;font:inherit;font-size:1rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gal-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.gal-card h3{margin:0;font-size:1rem}.gal-card p{margin:0;flex:1}.gal-tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.gal-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
/* ===== art direction (docs/art_direction.md): section hues, page glyphs, illustrations, signs of life, the theme picker. Tokens only ===== */
/* section hue: one colour per place, used for an icon tint and the active marker, nothing else */
body[data-sec=home],.nav[data-sec=home]{--hue:var(--hue-projects)}
body[data-sec=console],.nav[data-sec=console]{--hue:var(--hue-workspace)}
body[data-sec=team],.nav[data-sec=team]{--hue:var(--hue-models)}
body[data-sec=settings],.nav[data-sec=settings]{--hue:var(--hue-settings)}
.nav .ic{color:var(--hue)}
.nav[aria-current=page]::before{background:var(--hue)}
.subtabs button{position:relative}
.subtabs button .ic{width:15px;height:15px;color:var(--hue);opacity:.8}
.subtabs button[aria-current=page] .ic{opacity:1}
.subtabs button[aria-current=page]::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:var(--hue)}
/* the page glyph beside the title, and the page's own small drawing at the right of the heading */
#pageGlyph{width:42px;height:42px;border-radius:var(--rs);display:grid;place-items:center;flex:none;align-self:center;color:var(--hue);
  background:color-mix(in srgb,var(--hue) 11%,var(--panel));border:1px solid color-mix(in srgb,var(--hue) 22%,var(--line))}
#pageGlyph .ic{width:22px;height:22px;opacity:1}
.top{align-items:center}
#pageArt{width:136px;height:80px;flex:none;align-self:center}
@media (max-width:1100px){#pageArt{display:none}}
/* illustrations: one line weight, the hue for what matters, the theme's own surfaces for the rest; no fixed colour anywhere */
svg.art{display:block;color:var(--faint);overflow:visible}
.art .a-pl{fill:color-mix(in srgb,var(--hue) 8%,transparent);stroke:none}
.art .a-ln{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.art .a-hi{fill:none;stroke:var(--hue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.art .a-fl{fill:var(--panel);stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.art .a-sf{fill:var(--soft);stroke:none}
.art .a-tn{fill:color-mix(in srgb,var(--hue) 18%,var(--panel));stroke:var(--hue);stroke-width:1.5;stroke-linejoin:round}
.art .a-dt{fill:var(--hue);stroke:none}
.empty>svg.art,.st-empty>svg.art,.bp-empty>svg.art{width:104px;height:62px;margin:2px auto 12px}
.gs-art{width:120px;height:72px;flex:none}
.fv-art{width:112px;height:66px;margin:2px 0 6px}
.cmp-row figure svg.art{width:120px;height:72px}
@media (max-width:600px){.gs-art{display:none}}
/* card headers carry a small icon in the section hue */
.card h2>.ic.hic{width:.92em;height:.92em;margin-right:.42em;color:var(--hue);opacity:.9;vertical-align:-.1em}
/* signs of life: the Workspace tab breathes while a run or job is working (shape + motion; the side chip says it in words) */
.nav[data-sec=console]::after{content:"";width:7px;height:7px;border-radius:50%;margin-left:auto;flex:none;background:var(--hue);opacity:0;transform:scale(.5);
  transition:opacity var(--base) var(--ease),transform var(--base) var(--ease)}
body.is-busy .nav[data-sec=console]::after{opacity:1;transform:none;animation:artBeat 1.6s var(--ease) infinite}
body.is-busy #pageGlyph{animation:artBeat 2.4s var(--ease) infinite}
@keyframes artBeat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hue) 50%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* loading blocks get two shimmering lines under their sentence */
.card>div.st-load::after,.card>p.st-load::after,#view>div.st-load::after{content:"";display:block;height:28px;margin-top:10px;border-radius:var(--rs);
  background:linear-gradient(90deg,var(--soft) 25%,color-mix(in srgb,var(--soft) 55%,var(--panel)) 37%,var(--soft) 63%) 0 0/400% 100%;
  -webkit-mask:linear-gradient(var(--ink) 0 0) top left/100% 9px no-repeat,linear-gradient(var(--ink) 0 0) bottom left/62% 9px no-repeat;
  mask:linear-gradient(var(--ink) 0 0) top left/100% 9px no-repeat,linear-gradient(var(--ink) 0 0) bottom left/62% 9px no-repeat;animation:shimmer 1.4s ease infinite}
/* a hidden tab runs no animation at all */
.tab-away *,.tab-away *::before,.tab-away *::after{animation-play-state:paused!important}
/* the theme picker: five looks, each shown as a tiny page in its own tokens */
.th-midnight,.th-paper{background:var(--bg);color:var(--ink)}
.thpick{position:fixed;z-index:70;width:min(300px,calc(100vw - 16px));padding:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--pop);display:grid;gap:2px}
.thpick .mmhead{padding:6px 10px 4px;font:600 var(--t-label)/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.thpick .mmrow[aria-checked=true]{background:var(--acc2)}
.thpick .mmrow[aria-checked=true] .mmcheck{color:var(--acc)}
.thpick .mmcheck{width:16px;display:grid;place-items:center;flex:none}
.thpick .mmcheck .ic{width:15px;height:15px}
.thsw{width:44px;height:30px;border-radius:var(--r-xs);border:1px solid var(--line);flex:none;display:flex;overflow:hidden;padding:4px;gap:3px}
.thsw>span{flex:1;display:flex;flex-direction:column;gap:3px;padding:3px;border-radius:3px;background:var(--panel);border:1px solid var(--line)}
.thsw i{display:block;height:3px;border-radius:2px;background:var(--acc)}
.thsw b{display:block;height:3px;width:70%;border-radius:2px;background:var(--mute);opacity:.6}
.thsw.split{padding:0;gap:0}.thsw.split>span{border-radius:0;border:0;padding:6px 4px}

/* ===== Components page (Settings > Components): every part in both themes, side by side; tokens only ===== */
.th-light,.th-dark{background:var(--bg);color:var(--ink)}
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:var(--s4)}
.cmp-frame{border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);display:grid;gap:var(--s5);min-width:0;align-content:start}
.cmp-frame>header{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.cmp-frame>header b{font:650 var(--t-l)/1.2 var(--font-head)}
.cmp-sec{display:grid;gap:var(--s2);min-width:0}
.cmp-h{margin:0;font:600 var(--t-label)/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.cmp-row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.cmp-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.cmp-sw>div{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-xs);min-width:0}
.cmp-sw i{width:22px;height:22px;border-radius:var(--r-xs);border:1px solid var(--line);flex:none}
.cmp-sw code{background:none;padding:0}
.cmp-type p{margin:0}
.cmp-frame .card{margin:0}
.cmp-frame .doing{max-height:none}
.cmp-menu{position:relative;display:inline-block}
.cmp-menu .mmenu{position:static;margin-top:var(--s2);width:min(290px,100%)}

/* ===== accessibility: keyboard rows in menus, and state that is never shown by colour alone ===== */
.mmrow:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;background:var(--soft)}
.plan li[tabindex]{cursor:pointer}
.mm-model .mm-dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}          /* stopped = hollow ring */
.mm-model.up .mm-dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.ccdot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}                       /* running = ring */
.ccdot.ok{background:var(--good);box-shadow:none}.ccdot.err{background:var(--bad);box-shadow:none;border-radius:2px} /* failed = square */
.mp-n.ok-null rect.mp-box{stroke-dasharray:5 3}.mp-n.ok-false rect.mp-box{stroke-width:2.5}     /* could not run = dashed */
.rv-n.gate.unsure polygon{stroke-dasharray:5 3}.rv-n.gate.fail polygon{stroke-width:2.5}
.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
@media (forced-colors:active){.dot,.mm-dot,.ccdot,.lane-b,.meter i,.bar>i{forced-color-adjust:none}.chip,.btn,.subtabs button,.tfilter button{border:1px solid CanvasText}}


/* the bundled interface font: Inter (variable weight, Latin), served by the hub itself (SIL OFL 1.1, static/fonts/LICENSE-Inter.txt) */
@font-face{font-family:"Inter Architect";src:url("/fonts/inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
body{font-feature-settings:"cv11","ss01","tnum" 0;font-optical-sizing:auto}
/* ===== design reset (2026-11-04): one type scale, space instead of boxes, a calm canvas, sentence-case labels ===== */
.sheet::before,.sheet::after{display:none}
main{background:none!important}
html{font-size:1rem}
body{font-size:.9688rem;line-height:1.55;letter-spacing:normal;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:radial-gradient(900px 520px at 88% -12%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 70%)!important}
*{letter-spacing:normal}
h1,.ttl{font-family:var(--font-head);font-size:1.85rem;line-height:1.2;font-weight:650;letter-spacing:-.015em}
h2{font-family:var(--font-head);font-size:1.22rem;line-height:1.3;font-weight:620;letter-spacing:-.01em}
h3{font-family:var(--font-head);font-size:1.04rem;line-height:1.35;font-weight:600}
#pageTitle{font-size:1.75rem;font-weight:650;letter-spacing:-.02em}
p,li,dd,td{font-size:inherit}
.sub,.hint{font-size:.94rem;line-height:1.55}
.small,.mute.small,small{font-size:.875rem}
.chip,.btn.sm,.subtabs button,td,th,label.f,.meta{font-size:.875rem}
.btn{font-size:.94rem;font-weight:550}
.num,td.n,.btile b,.k b{font-variant-numeric:tabular-nums}
.lbl,.mmhead,.gal-tag,.tlabel{text-transform:none!important;letter-spacing:normal!important;font-size:.8rem;font-weight:600;color:var(--mute)}
/* space, not borders: a card is a soft surface; a card inside a card is just a section */
.card{border-color:transparent!important;box-shadow:0 1px 2px color-mix(in srgb,var(--bg) 60%,transparent);border-radius:16px;padding:22px 24px}
.card .card{background:transparent;box-shadow:none;padding:16px 0 0;border-top:1px solid var(--line)!important;border-radius:0}
.note{border-radius:12px}
#view{max-width:1180px}
/* the side bar: navigation first, one status line that opens on click */
.sidefoot .sf-more{display:none}.sidefoot.sf-open .sf-more{display:block}
#sOllama{cursor:pointer}
/* sub-tabs: five in view, the rest under More */
.st-wrap{position:relative;display:inline-flex}.st-more{flex:none}
.st-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:200px;padding:6px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);box-shadow:0 12px 32px color-mix(in srgb,var(--bg) 70%,transparent);display:grid;gap:2px}
.st-menu[hidden]{display:none}.st-menu button{text-align:left;padding:8px 12px;border-radius:8px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.st-menu button:hover,.st-menu button:focus-visible{background:var(--acc2);color:var(--acc)}
@media (min-width:701px){.subtabs{overflow:visible}}
@media (max-width:700px){.st-menu{position:fixed;left:12px;right:12px;bottom:12px;top:auto}}
/* life: content settles in; a run's newest step glows once */
#view>*{animation:rs-in .22s ease-out both}
@keyframes rs-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sp-step.now .sp-ico{animation:rs-pulse 1.4s ease-in-out infinite}
@keyframes rs-pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 18%,transparent)}}
/* the cost map's points: a pointer, and a ring the keyboard can see */
.cm-pt{cursor:pointer;outline:none}.cm-pt:focus-visible>:last-child{stroke:var(--ink);stroke-width:3}
/* measured cost where work is picked (Gallery workflow cards, the route preview): one chip per task family, each opens the Cost map */
.gal-costs{display:flex;flex-wrap:wrap;gap:6px}.gal-cost{font-family:inherit;white-space:normal;text-align:left;cursor:pointer}.gal-cost:hover{border-color:var(--acc)}.cost-line{margin-top:4px}
/* the Caches page: split bars (share of input, pauses between replies) and their legend swatches, all theme tokens */
.ca-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft);margin:8px 0 6px}.ca-bar>span{display:block;height:100%}
.ca-read,.ca-g1{background:var(--good)}.ca-write,.ca-g2{background:var(--warn)}.ca-unc,.ca-g3{background:var(--faint)}
.ca-sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.ca-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 28px}
.ca-legend{display:flex;flex-wrap:wrap;gap:4px 16px}.ca-finds{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ca-finds li{display:flex;gap:10px;align-items:baseline}.ca-finds .chip{flex:none}
.ca-scroll{overflow-x:auto;border-radius:12px}.ca-scroll:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* a window (report, run timeline) floats over the page: a later .card rule had made it position:relative, so it opened below everything */
.card.modal{position:fixed;inset:5% 6%;z-index:60;overflow:auto;box-shadow:0 20px 60px color-mix(in srgb,var(--bg) 70%,transparent)}
/* ===== reduced motion: one rule for the whole app (the older per-layer copies above say the same thing) ===== */

.sp-proj{align-items:flex-end}
.rc{position:relative}
.rc-in{display:flex;gap:0}
.rc-in input{flex:1;min-width:0;border-top-right-radius:0;border-bottom-right-radius:0}
.rc-tog{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px;min-width:40px;justify-content:center}
.rc-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);margin:0;padding:var(--s1);list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);
  box-shadow:0 12px 28px -12px color-mix(in srgb,var(--ink) 35%,transparent);max-height:280px;overflow:auto}
.rc-opt{display:flex;align-items:center;gap:var(--s2);min-height:36px;padding:0 var(--s3);border-radius:var(--rs);cursor:pointer;color:var(--ink);font-size:var(--t-label,13px)}
.rc-opt .ic{width:16px;height:16px;flex:none;color:var(--mute)}
.rc-opt[aria-selected=true],.rc-opt:hover{background:var(--acc2);color:var(--acc)}
.rc-opt.rc-pri{font-weight:600;color:var(--acc)}
.rc-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thispc>summary{list-style:none}.thispc>summary::-webkit-details-marker{display:none}
.thispc>summary::before{content:"+ "}.thispc[open]>summary::before{content:"− "}
.thispc .statrow{margin-bottom:0}
.feedrow small{white-space:nowrap}
.res-ico{animation:resPop .3s var(--spring) 1}
@keyframes resPop{from{transform:scale(.8)}to{transform:none}}
/* live chip: short text, full detail in title; never wraps the top bar */
#liveChip.livechip{max-width:360px;min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#liveChip .lc-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#liveChip .btn{flex:none}
.lc-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;animation:lcPulse 1.6s var(--ease) infinite}
@keyframes lcPulse{50%{opacity:.35}}
@media (max-width:767px){
  .hero.home .sp-goal{padding-bottom:14px}
  .sp-go{position:static;width:100%;margin-top:var(--s2);min-height:48px}
  .sp-try .sp-recipes{overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,var(--mask) 85%,transparent);mask-image:linear-gradient(to right,var(--mask) 85%,transparent);padding-right:var(--s5)}
  .sp-try .sp-recipe,.rc-opt,.rc-tog,.sp-help,.hero.home .btn,.feedrow .btn{min-height:44px;min-width:44px}

/* Plugins, Telemetry, Squad runs, Health, first run */
.firstrun .stops{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:10px 0 0}
.tl-row{display:grid;grid-template-columns:minmax(120px,30%) 1fr auto;gap:8px;align-items:center;font-size:.8125rem;padding:2px 0}
.tl-bar{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.tl-bar>i{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--hue,var(--acc))}
.tl-bar>i.err{background:var(--bad)}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kcards .card{margin:0}.kcards b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.pl-card{display:flex;gap:12px;align-items:flex-start}.pl-card .grow{min-width:0}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:6px}
.si-diff pre{font:12px/1.45 var(--mono);max-height:420px;overflow:auto;background:var(--soft);padding:10px;border-radius:var(--rs);white-space:pre}
.si-diff .add{color:var(--good);background:var(--goodbg)}.si-diff .del{color:var(--bad);background:var(--badbg)}
/* V-G: ONE reduced-motion block for the whole app, last in the sheet so nothing after it can bring motion back */
/* Review, plan, session panel, queue board, recipe cards: theme tokens only */
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.rv-side{position:sticky;top:12px;min-width:0}
@media (max-width:900px){.rv-grid{grid-template-columns:minmax(0,1fr)}.rv-side{position:static}}
.rv-file{border:1px solid var(--line);border-radius:var(--rs);margin:8px 0;background:var(--panel)}
.rv-file[aria-current=true]{border-color:var(--acc)}
.rv-file>summary{display:flex;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;min-height:44px;min-width:0}
.rv-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono,monospace)}
.rv-pm{white-space:nowrap}.rv-plus{color:var(--good)}.rv-minus{color:var(--bad)}
.rv-diff{padding:0 12px 12px;overflow-x:auto}.rv-diff pre{margin:0;font-size:.8125rem;line-height:1.45}
.dl{display:block}.dl-add{background:var(--goodbg)}.dl-del{background:var(--badbg)}.dl-hunk{color:var(--info)}.dl-meta{color:var(--mute)}
.rv-tests,.rv-plan,.ses-list,.qb-list{list-style:none;margin:6px 0;padding:0}
.rv-test,.rv-step,.ses-list li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}
.rv-tx{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rv-off{text-decoration:line-through;color:var(--mute)}
.rv-act textarea{width:100%;margin-top:10px;box-sizing:border-box}
.rv-k{border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;font-size:.75rem;background:var(--soft);color:var(--mute)}
@media (max-width:768px){.rv-act .btn,.rv-step .btn{min-height:44px}}
.rv-verdict{display:flex;align-items:center;gap:var(--s2);margin:0;font-size:1.75rem;line-height:1.2;font-weight:700}
.rv-verdict .ic{width:1.6em;height:1.6em;flex:none}
.rv-verdict.good{color:var(--good)}.rv-verdict.bad{color:var(--bad)}.rv-verdict.warn{color:var(--warn)}.rv-verdict.info{color:var(--info)}
.rv-fail{margin:6px 0 0;padding:8px 12px;border-radius:var(--rs);background:var(--badbg);color:var(--bad);font-weight:600;overflow-wrap:anywhere}
.rv-step{outline-offset:2px}.rv-step:focus-visible{outline:2px solid var(--acc)}
.rv-step .rv-mv{min-width:36px;min-height:36px;padding:0 8px}
.rv-role{color:var(--mute)}
.stale{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--warn);background:var(--warnbg);color:var(--warn);font-weight:600}
.stale .grow{flex:1;min-width:200px}
.stale .btn{min-height:44px}
.ses>summary{cursor:pointer;padding:6px 0;font-weight:600}
.ctxbar{position:relative;display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);margin:6px 0}
.ctxseg{display:block;height:100%}.ctxmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.ses-dot{width:10px;height:10px;border-radius:99px;flex:none;display:inline-block}.ses-free{background:var(--soft);border:1px solid var(--line)}
.qb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
@media (max-width:700px){.qb{grid-template-columns:minmax(0,1fr)}}
.qb-col{background:var(--soft);border-radius:var(--rs);padding:10px;min-width:0}.qb-col h3{margin:0 0 6px}
.qb-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;margin:6px 0;overflow-wrap:anywhere}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .shimmer,.statcard[data-tone=loading] b{background:var(--soft)}
  .fm-step{opacity:1;transform:none}
  .st-load::before{border-top-color:currentColor}}
/* Data night, Train the worker, Last night, Lessons, Advanced settings: theme tokens only; primary actions are 44px or taller */
.btn.p,.btn.danger.dn-big{min-height:44px}
.dn-big{min-height:48px;padding:0 var(--s5,22px);font-size:1.05rem}
.dn-grid{margin:10px 0}.dn-f .hint{display:block;font-size:.78rem;color:var(--mute)}

.dn-actions{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.dn-run{margin-top:6px}
.dn-preview{padding:8px 0}
#twCard .sw{min-height:44px;align-items:center}
.night-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.night-rate{font-size:1.05rem;font-weight:650;margin:0}
.ls-wrap{overflow-x:auto;margin-top:10px}.ls-tbl td,.ls-tbl th{vertical-align:top}.ls-ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ls-t .chip{max-width:100%;white-space:normal}
details.adv>summary{min-height:44px;display:flex;align-items:center}.adv-body{display:grid;gap:14px;margin-top:12px}
@media (max-width:768px){.dn-actions .btn{flex:1 1 100%}.dn-big{min-height:48px}}
/* Background jobs, Hooks, Usage, Set up, Keep/Drop hunks: theme tokens only, 44 px targets */
#bgCard .btn,.hk-row .btn,#hkAdd,#suAccept,.rv-hunk .btn,#rvBundle,#rvCommit,#usageChip,#spSetupBtn{min-height:44px}
.bg-job{border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;margin:8px 0;background:var(--panel)}

.bg-tail{max-height:220px;overflow:auto;margin:6px 0 0;padding:8px;background:var(--panel2,var(--panel));border:1px solid var(--line);border-radius:var(--rs);font-family:var(--mono,monospace);font-size:.8rem;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.bg-t{min-width:0;overflow-wrap:anywhere}
.hk-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.hk-row{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;background:var(--panel)}
.hk-cmd{display:block;margin-top:4px;overflow-wrap:anywhere;color:var(--ink)}
.rv-hunk{border:1px solid var(--line);border-radius:var(--rs);margin:8px 0;padding:6px 8px;background:var(--panel)}
.rv-hunk.dropped{opacity:.7;border-style:dashed}.rv-hunk.dropped pre{text-decoration:line-through}
.rv-hunk pre{margin:6px 0 0;overflow:auto;max-height:320px}
#usageChip{max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:768px){.hk-row{flex-direction:column}#usageChip{display:none}}

function applyEvents(feed){
  if(feed.epoch!==EV.epoch){                        // a new run: start the panel over rather than appending to the last one
    EV.epoch=feed.epoch;EV.since=0;EV.lanes=[];EV.live="";EV.steps=[];EV.tools=[];EV.gates=[];EV.esc=[];EV.todo=[];
    EV.calls=0;EV.tokens=0;EV.tok_s=null;EV.now=null;EV.nowModel=null;EV.nowRole=null;EV.nowTier=null;EV.verdict=null;EV.post=null;EV.flow=null;EV.cached=0;EV.sel=-1;EV.lastType=null;
  }
  EV.running=!!feed.running;
  for(const ev of feed.events||[]){
    const t=ev.type; if(t!=="token")EV.lastType=t;      // the request diagram lights the gate while a check is the newest thing
    if(ev.flow)EV.flow=ev.flow; if(ev.run)EV.run=ev.run;
    if(t==="call"){
      EV.calls++; EV.tokens+=(ev.gen_tokens||0);
      if(ev.tok_s)EV.tok_s=ev.tok_s;
      if(ev.cached)EV.cached++;
      EV.nowModel=ev.model||EV.nowModel; EV.nowRole=ev.role||EV.nowRole; EV.nowTier=ev.tier||EV.nowTier;
      if(ev.label)EV.now=ev.label;
      (EV.lanes=EV.lanes||[]).push({tier:ev.tier||"worker",role:ev.role,model:ev.model,secs:ev.secs||0,t:ev.t,ok:ev.done_reason!=="error"});
      EV.live="";
    } else if(t==="token"){ EV.live=((EV.live||"")+ev.text).slice(-900); EV.liveRole=ev.label||ev.role; EV.liveModel=ev.model; } else if(t==="tool"){ EV.tools.push(ev); if(ev.step)EV.now=ev.step; }
    else if(t==="check"){ EV.gates.push(ev); if(ev.step)EV.now=ev.step; }
    else if(t==="escalation"){ EV.esc.push(ev); }
    else if(t==="todo"){ EV.todo=ev.items||[]; }
    else if(t==="step"){
      const i=EV.steps.findIndex(x=>x.step===ev.step);
      if(i>=0)EV.steps[i]=ev; else EV.steps.push(ev);
      if(EV.now===ev.step)EV.now=null;
    }
    else if(t==="postmortem"){ EV.post=ev; }
    else if(t==="verdict"){ EV.verdict=ev; EV.now=null;
      if(ev.meter){EV.calls=ev.meter.calls||EV.calls;EV.tokens=(ev.meter.tokens_out||0);} }
  }
  EV.since=feed.next;
}

/* Minimal, safe formatting: fenced code, inline code, paragraphs. No HTML from the model is ever inserted. */
function renderText(t){
  const out=[];
  for(const part of String(t).split(/```/).entries()){
    const [i,chunk]=part;
    if(i%2===1){ out.push(h("pre",{},h("code",{},chunk.replace(/^\w*\n/,"")))); continue; }
    for(const para of chunk.split(/\n{2,}/)){
      if(!para.trim())continue;
      const p=h("p",{});
      para.split(/(`[^`]+`)/).forEach(bit=>{
        if(bit.startsWith("`")&&bit.endsWith("`")&&bit.length>2)p.append(h("code",{},bit.slice(1,-1)));
        else if(bit)p.append(document.createTextNode(bit));
      });
      out.push(p);
    }
  }
  return out;

async function slashUpdate(){

/* ---------- keyboard: the whole app without reaching for the mouse ---------- */
let ESC_AT=0,G_AT=0;
/* "g" then a letter (bare digits used to fire while you read a page) */
const typing=e=>{const t=e.target,n=t&&t.tagName;return n==="INPUT"||n==="TEXTAREA"||n==="SELECT"||(t&&t.isContentEditable);};

  if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();PAL?closePalette():openPalette();return;}
  if(e.key==="Escape"){
    if(HELP_EL){e.preventDefault();closeHelp();return;}      // closing the explainer must never also stop a run
    if(PAL){closePalette();return;}
    if(THPICK){e.preventDefault();closeThemePick(true);return;}  // the theme picker closes first, a run is never stopped by it
    if(document.body.classList.contains("nav-open")){e.preventDefault();navClose();return;}
    if(EV.running){e.preventDefault();const now=Date.now();
      if(ESC_AT&&now-ESC_AT<2000){ESC_AT=0;cStop();toast("Stopping after this step");}
      else{ESC_AT=now;toast("Press Esc again within 2 s to stop the run",2000);}return;}
  }
  if(typing(e)){G_AT=0;return;}
  /* Home: a printable key with nothing focused goes into the goal box (focus it, insert the character) instead of a shortcut */
  if(page==="overview"&&nothingFocused()&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key.length===1&&e.key!=="?"){
    const g=$("#spGoal"); if(g){e.preventDefault();G_AT=0;g.focus();const a=g.selectionStart??g.value.length,b=g.selectionEnd??a;
      g.setRangeText(e.key,a,b,"end");g.dispatchEvent(new Event("input",{bubbles:true}));return;}
  }
  if(e.key==="/"){const i=$("#cIn");if(i){e.preventDefault();go("console");setTimeout(()=>$("#cIn")&&$("#cIn").focus(),0);}else{e.preventDefault();go("console");}return;}
  if(e.key==="?"){e.preventDefault();HELP_EL?closeHelp():openKeys();return;}
  if(page==="console"&&(e.key==="j"||e.key==="k")&&EV.steps.length){
    e.preventDefault();
    EV.sel=Math.max(0,Math.min(EV.steps.length-1,(EV.sel<0?-1:EV.sel)+(e.key==="j"?1:-1)));

  }

  if(!nothingFocused()){G_AT=0;return;}
  if(G_AT&&Date.now()-G_AT<1200){G_AT=0;const dest=G_CHORDS[e.key.toLowerCase()];if(dest){e.preventDefault();go(dest[0]);}return;}

});
/* ============================================================================================
   First visit: a short guided path for someone opening the hub for the first time. Five stops:
   this machine (the Doctor's checks and Get ready, already measured), who does what (the tier
   picker, in plain words), a practice task in Architect's OWN data folder (never a folder of
   yours), the live board while it runs, and the result with where to go next. Skippable; where
   you were is kept in this browser. Every action is an existing one (Get ready, the team picker,
   a normal run with the normal checks), so nothing here is a second way of doing things.
   ============================================================================================ */
/* three stops (ux_audit): This computer -> Practice task -> Result. Internal step numbers stay 0..4 (1 = team, now
   reached only from Models; 3 = the slim dock while the practice runs); FV_SHOW maps them to the stop shown. */
const FV_KEY="firstVisit", FV_STEPS=["This computer","Practice task","Result"], FV_SHOW=[0,0,1,1,2];

/* Opens by itself once, on the very first visit. Someone who already has a team and a finished task is not walked through it again. */
function fvMaybeOpen(){
  const s=fvState(); if(FV.closed)return;
  if(s.status==="done"||s.status==="skipped"||s.status==="later")return;
  if(!s.status&&S){
    const worked=(S.history||[]).some(x=>x&&x.ok>0&&!/^fake:/.test(x.model||""));
    const team=!!(S.config&&Object.values(S.config.tiers||{}).some(Boolean));
    if(worked&&team){fvSave({status:"later",step:0});return;}
  }
  fvOpen(s.step||0);

function fvOpen(step,restart){
  FV.closed=false;
  if(restart){fvSave({status:"open",step:0,epoch:null,root:null});FV.info=null;FV.result=null;step=0;}
  step=Math.max(0,Math.min(FV_STEPS.length-1,step|0));

async function libPick(name){
  LIB.sel=name; store.set("libSel",name);
  document.querySelectorAll("#libList .ws-item").forEach(el=>el.classList.toggle("on",el.getAttribute("data-name")===name));
  const box=$("#libOne"); if(!box)return; box.innerHTML=""; box.append(h("div",{class:"skeleton",style:"height:160px"}));
  let r; try{r=await api("/api/arch/library?name="+encodeURIComponent(name));}catch(e){r={error:e.message};}

  if(r.error){box.append(h("div",{class:"note warn"},r.error));return;}

    box.append(h("div",{class:"row",style:"margin-top:10px"},h("span",{class:"grow small mute"},"Adds a row to the Fleet plan; nothing starts until you launch it there."),

async function libUse(name,inputs){
  const values={}; for(const [k,i] of Object.entries(inputs))if(i.value.trim())values[k]=i.value.trim();
  try{const r=await api("/api/arch/library",{fill:name,values}), row=r.row; flLoadPlan();
    const names=new Set(FL.plan.map(a=>a.name)); let nm=row.name, n=2; while(names.has(nm))nm=row.name+"-"+(n++); row.name=nm;
    if(FL.plan.length===1&&!FL.plan[0].brief&&!FL.plan[0].files)FL.plan=[row]; else FL.plan.push(row);
    if((r.tests||[]).length){const cur=flTestsText().split("\n").map(s=>s.trim()).filter(Boolean);for(const c of r.tests)if(!cur.includes(c))cur.push(c);FL.tests=cur.join("\n");}
    flSave(); toast(nm+" is in the fleet plan"); go("fleet");
  }catch(e){toast.err(e.message,8000);}

/* ---------------------------------------------------------------- the price of a Claude message, shown before it is sent */
let TOK={timer:0,seq:0};
function tokPreview(){
  clearTimeout(TOK.timer); const el=$("#cCost"); if(!el)return;
  const use=store.get("chatUse","local"), txt=(($("#cIn")||{}).value||"").trim();
  if(!use.startsWith("claude")||!txt||txt.startsWith("/")){el.hidden=true;TOK.seq++;return;}
  TOK.timer=setTimeout(async()=>{
    const seq=++TOK.seq, model=use.includes(":")?use.slice(use.indexOf(":")+1):((S&&S.cloud&&S.cloud.model)||"");
    try{const r=await api("/api/arch/token_preview",{model,message:txt,ctx:store.get("chatCtx","normal"),council:store.get("chatUltra","0")==="1"||/\bcouncil\b/i.test(txt)});
      if(seq!==TOK.seq)return; if(!r.available){el.hidden=true;return;}
      el.textContent=r.line; el.title="What this message should cost on "+(r.model||"Claude")+", before it is sent. The reply length is a guess."; el.hidden=false;}
    catch(_){if(seq===TOK.seq)el.hidden=true;}
  },700);
}
/* the Console's box is built in the main script; the preview listens from here so neither script has to know the other's insides */
document.addEventListener("input",e=>{if(e.target&&e.target.id==="cIn")tokPreview();});
document.addEventListener("click",e=>{if(e.target&&e.target.closest&&e.target.closest("#cSend,.mmrow"))setTimeout(tokPreview,60);});
document.addEventListener("keydown",e=>{if(e.target&&e.target.id==="cIn"&&e.key==="Enter"&&!e.shiftKey)setTimeout(tokPreview,60);});
