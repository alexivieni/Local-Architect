      h("div",{class:"row"},h("button",{class:"btn",onclick:()=>runAct("export_stats")},"Count examples"),h("button",{class:"btn p",onclick:()=>runAct("export")},"Export now"),h("button",{class:"btn",onclick:()=>runAct("train_check")},"Can this PC train?")),
      h("div",{class:"note warn"},"A few hundred accepted examples per role is a sensible minimum. Tuning on a model's own output can reinforce its mistakes, so only code-verified calls are kept. Compare before and after on the Scoreboard and keep the old model until the new one wins.")),
    h("div",{class:"card"},h("h2",null,"Fine-tune a small model (QLoRA)"),h("p",{class:"sub"},"train_lora.py has not been run on real hardware by its author. Read it first. Reinforcement learning with test rewards (GRPO) needs more GPU memory than a 6 GB card: rent a 24 GB GPU for that."),
      h("pre",{class:"cmd"},"python arch_training.py\npython train_lora.py --check\npython train_lora.py --data hub_data/train/evaluator.jsonl --base unsloth/Qwen3-4B-Instruct-2507 --gguf\ncd hub_data/lora_out && ollama create my-evaluator -f Modelfile")),
  ];
}
async function runAct(name){go("run");await action(name);}

/* ---------- boot ---------- */
/* Appearance has three states, and "Auto" is one of them: following the computer's own setting is what most people want, and the
   old toggle could not express it. It also compared --bg against a colour that appears nowhere in this file, so it always wrote "dark". */
const THEMES=["system","light","dark"];
const THEME_LABEL={system:"Auto",light:"Light",dark:"Dark"};
const THEME_ICON={system:"auto",light:"sun",dark:"moon"};
function applyTheme(t){
  if(t==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  const b=$("#themeBtn");
  if(b){b.innerHTML="";b.append(icon(THEME_ICON[t]),document.createTextNode(THEME_LABEL[t]));
        b.title="Appearance: "+THEME_LABEL[t]+(t==="system"?" (follows this computer)":"")+" — click to change";}
}
function cycleTheme(){const cur=store.get("theme","system");const nxt=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];store.set("theme",nxt);applyTheme(nxt);toast("Appearance: "+THEME_LABEL[nxt],1600);}
$("#themeBtn").addEventListener("click",cycleTheme);
applyTheme(store.get("theme","system"));

/* ---------- the command palette: everything reachable without a mouse ---------- */
function commandList(){
  const cmds=PAGES.map(p=>({ic:tabOf(p[0])[1],label:p[2],sub:p[3],go:()=>go(p[0])}));
  cmds.push(
    {ic:"spark",label:"New thread",sub:"Start the conversation over",go:()=>cNew()},
    {ic:"play",label:"Continue the last run",sub:"Picks up where the most recent run in this project stopped",go:async()=>{
      try{const rs=await api("/api/arch/runs?root="+encodeURIComponent(run.root||""));const r=rs&&rs[0];if(!r){toast("No runs in this project yet");return;}
        go("console");setTimeout(()=>{const c=$("#cIn");if(c){c.value="Continue the last run ("+r.goal+"): finish what is left, keep what already passes.";c.focus();}},50);}catch(e){toast.err(e.message);}}},
    {ic:"book",label:"Open the last receipt",sub:"Everything the most recent run did, on one page",go:async()=>{
      try{const rs=await api("/api/arch/runs?root="+encodeURIComponent(run.root||""));const r=rs&&rs[0];if(!r){toast("No runs in this project yet");return;}
        window.open("/api/arch/receipt?run="+encodeURIComponent(r.name)+"&root="+encodeURIComponent(run.root||""),"_blank");}catch(e){toast.err(e.message);}}},
    {ic:"stop",label:"Stop the run",sub:"Stops between steps, nothing is half-applied",go:()=>cStop()},
    {ic:THEME_ICON[store.get("theme","system")],label:"Change appearance",sub:"Auto, light or dark",go:cycleTheme},
    {ic:"health",label:"Run the doctor",sub:"Real checks: Python, Ollama, disk, port, git",go:()=>{go("doctor");}},
    {ic:"chip",label:"Tune for this machine",sub:"Measure and pick what fits this GPU",go:()=>{go("tune");}},
    {ic:"book",label:"Export training data",sub:"Turn verified work into training files",go:()=>{go("train");}},
    {ic:"search",label:"Search this project",sub:"Full-text over functions and notes",go:()=>{go("run");}},
  );
  return cmds;
}
let PAL=null;
function openPalette(){
  if(PAL)return;
  const all=commandList();
  const input=h("input",{type:"text",placeholder:"Go to, or do…","aria-label":"Command",autocomplete:"off",spellcheck:"false"});
  const list=h("ul",{role:"listbox"});
  let shown=all, idx=0;
  const draw=()=>{
    list.innerHTML="";
    if(!shown.length){list.append(h("li",{class:"empty"},"Nothing matches that."));return;}
    shown.forEach((c,i)=>list.append(h("li",{role:"option","aria-selected":i===idx?"true":"false",
      onmouseenter:()=>{idx=i;draw();},onclick:()=>{closePalette();c.go();}},
      icon(c.ic),h("span",{},c.label,h("div",{class:"sub2"},c.sub)),i===idx?h("span",{class:"sub2"},"↵"):null)));
    const sel=list.children[idx]; if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:"nearest"});
  };
  const filter=()=>{
    const q=input.value.trim().toLowerCase();
    shown=!q?all:all.filter(c=>(c.label+" "+c.sub).toLowerCase().includes(q));
    idx=0;draw();
  };
  input.addEventListener("input",filter);
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();idx=Math.min(idx+1,shown.length-1);draw();}
    else if(e.key==="ArrowUp"){e.preventDefault();idx=Math.max(idx-1,0);draw();}
    else if(e.key==="Enter"){e.preventDefault();const c=shown[idx];if(c){closePalette();c.go();}}
    else if(e.key==="Escape"){e.preventDefault();closePalette();}
  });
  PAL=h("div",{class:"palette",role:"dialog","aria-modal":"true","aria-label":"Commands",
    onclick:e=>{if(e.target===PAL)closePalette();}},h("div",{class:"box"},input,list));
  document.body.append(PAL);
  draw();input.focus();
}
function closePalette(){ if(PAL){PAL.remove();PAL=null;} }
$("#paletteBtn").addEventListener("click",openPalette);

/* ---------- keyboard: the whole app without reaching for the mouse ---------- */
const typing=e=>{const t=e.target,n=t&&t.tagName;return n==="INPUT"||n==="TEXTAREA"||n==="SELECT"||(t&&t.isContentEditable);};
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();PAL?closePalette():openPalette();return;}
  if(e.key==="Escape"){
    if(PAL){closePalette();return;}
    if(EV.running){e.preventDefault();cStop();return;}
  }
  if(typing(e))return;
  if(e.key==="/"){const i=$("#cIn");if(i){e.preventDefault();go("console");setTimeout(()=>$("#cIn")&&$("#cIn").focus(),0);}else{e.preventDefault();go("console");}return;}
  if(e.key==="?"){e.preventDefault();openPalette();return;}
  if(page==="console"&&(e.key==="j"||e.key==="k")&&EV.steps.length){
    e.preventDefault();
    EV.sel=Math.max(0,Math.min(EV.steps.length-1,(EV.sel<0?-1:EV.sel)+(e.key==="j"?1:-1)));
    renderDoing();return;
  }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=TABS.length&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();go(TABS[n-1][3][0]);}
});
go("console");refresh(true);
setInterval(()=>{if(!document.hidden&&!dirty&&page!=="run"&&!(S&&S.tests.running&&page==="score"))refresh();},9000);
</script>
