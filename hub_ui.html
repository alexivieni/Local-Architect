*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font:650 16px/1 var(--font-head);letter-spacing:.1px}
.brand span:last-child{color:var(--ink);font-weight:600}
.logo{width:28px;height:28px;border-radius:6px;background:var(--bp);display:grid;place-items:center;color:#eaf1ff;font:600 13px var(--font-head);flex:none;position:relative;overflow:hidden}.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--bpline) 1px,transparent 1px),linear-gradient(90deg,var(--bpline) 1px,transparent 1px);background-size:7px 7px;opacity:.5}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}.subtabs:empty{display:none}.subtabs button{border:1px solid var(--line);background:var(--panel);color:var(--mute);font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer}.subtabs button[aria-current=page]{background:var(--acc2);color:var(--acc);border-color:transparent;font-weight:650}
.card{overflow-x:auto}code{overflow-wrap:anywhere}.chip{max-width:100%;overflow-wrap:anywhere}.f{min-width:0;max-width:100%}.f select,.f input{max-width:100%}
[hidden]{display:none!important}
.tplbtn{text-align:left;padding:12px;display:block;white-space:normal}.tplbtn.on{border-color:var(--acc);background:var(--acc2)}
.navgroup{margin:12px 0 2px;padding:0 12px;font-size:12px;font-weight:600;color:var(--faint)}
.navgroup:first-of-type{margin-top:0}
.nav{position:relative;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:8px 12px 8px 15px;border-radius:var(--rs);cursor:pointer;text-align:left;width:100%;transition:background .12s,color .12s}
.nav::before{content:"";position:absolute;left:3px;top:50%;width:3px;height:0;border-radius:3px;background:var(--grad);transform:translateY(-50%);transition:height .15s ease}
.nav .g{width:20px;text-align:center;font-size:14.5px;opacity:.85;flex:none}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav[aria-current=page]{background:var(--acc2);color:var(--acc);font-weight:650}
.nav[aria-current=page]::before{height:18px}
.sidefoot{margin-top:auto;display:grid;gap:7px;padding:12px 10px 4px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
main{padding:24px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;margin-bottom:20px}
.top h1{margin:0;font:600 24px/1.2 var(--font-head);letter-spacing:-.3px}.top p{margin:3px 0 0;color:var(--mute);font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);animation:cardIn .18s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 4px;font:600 17px/1.3 var(--font-head);letter-spacing:-.1px}.card>h3{margin:16px 0 8px;font-size:12.5px;color:var(--mute);font-weight:650;letter-spacing:.02em}
.sub{color:var(--mute);font-size:13.5px;margin:0 0 12px}
.section-head{display:flex;align-items:baseline;gap:8px;margin:26px 0 10px}.section-head:first-child{margin-top:4px}
.section-head b{font-size:12.5px;color:var(--mute);font-weight:650}.section-head i{flex:1;height:1px;background:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}.grow{flex:1 1 auto}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mono{font-family:var(--mono)}.mute{color:var(--mute)}.small{font-size:12.5px}
.card[role=button]{cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .1s}
.card[role=button]:hover{border-color:var(--acc);transform:translateY(-1px)}
.card[role=button]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12.5px;background:var(--soft);color:var(--mute);border:1px solid transparent;white-space:nowrap;transition:background .12s,color .12s}
.chip.good{background:var(--goodbg);color:var(--good)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.info{background:var(--infobg);color:var(--info)}.chip.acc{background:var(--acc2);color:var(--acc)}
.chip.sec{background:var(--secbg);color:var(--sec)}.chip.infra{background:var(--infrabg);color:var(--infra)}
.btn{background:var(--soft);color:var(--ink);border:1px solid var(--line);padding:7px 14px;border-radius:10px;font:inherit;cursor:pointer;transition:border-color .12s,background .12s,transform .08s}
.btn:hover:not(:disabled){border-color:var(--acc)}.btn:active:not(:disabled){transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:var(--acc);color:#fff;border-color:transparent;font-weight:600}.btn.p:hover:not(:disabled){background:var(--bp2)}
.btn.danger{color:var(--bad)}.btn.sm{padding:4px 10px;font-size:13px}
a.link{color:var(--acc);cursor:pointer;text-decoration:none}a.link:hover{text-decoration:underline}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea{width:100%;font-family:var(--mono);font-size:13px}
input[type=number]{width:110px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute)}label.f .hint{font-size:11.5px}
label.sw{display:flex;align-items:center;gap:8px;cursor:pointer}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:var(--acc);border-radius:5px}
.cell{display:inline-block;min-width:42px;text-align:center;padding:2px 6px;border-radius:7px;font-variant-numeric:tabular-nums}
.s-hi{background:var(--goodbg);color:var(--good)}.s-mid{background:var(--warnbg);color:var(--warn)}.s-lo{background:var(--badbg);color:var(--bad)}.s-na{color:var(--mute)}
.ava{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--acc2);color:var(--acc);flex:none}
.ava.sec{background:var(--secbg);color:var(--sec)}.ava.infra{background:var(--infrabg);color:var(--infra)}
.rcard{display:flex;flex-direction:column;gap:10px}
.ptile{width:52px;height:52px;border-radius:8px;background:var(--bp);flex:none;overflow:hidden;position:relative}.ptile::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--bpline) 1px,transparent 1px),linear-gradient(90deg,var(--bpline) 1px,transparent 1px);background-size:9px 9px;opacity:.25}.ptile svg{position:relative;width:100%;height:100%;display:block}
.ptile.sm{width:36px;height:36px;border-radius:6px}
.rcard .head{display:flex;gap:12px;align-items:center}.rcard h3{margin:0;font-size:15.5px;text-transform:none;letter-spacing:0;color:var(--ink)}
.need{display:flex;flex-wrap:wrap;gap:6px}
.rec{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font-size:13.5px}
.rec.top{border-color:var(--acc);background:var(--acc2)}
.flow{display:flex;gap:0;overflow:auto;padding:6px 2px 12px;align-items:stretch}
.step{min-width:140px;max-width:170px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--panel);position:relative;margin-right:26px;flex:none}
.step:not(:last-child)::after{content:"";position:absolute;right:-26px;top:50%;width:26px;height:2px;background:var(--line)}
.step:not(:last-child)::before{content:"";position:absolute;right:-27px;top:calc(50% - 4px);border:5px solid transparent;border-left:7px solid var(--line);border-right:0}
.step b{display:block;font-size:13px;line-height:1.3}.step span{font-size:11.5px;color:var(--mute)}
.step.llm{border-top:3px solid var(--llm)}.step.code{border-top:3px solid var(--code)}.step.judge{border-top:3px solid var(--judge)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.term{background:var(--term);color:var(--term-ink);font:12.5px/1.5 var(--mono);border-radius:12px;padding:14px;height:440px;overflow:auto;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line)}
.dp{color:var(--add)}.dm{color:var(--del)}.dh{color:var(--hunk)}
.empty{padding:34px;text-align:center;color:var(--mute)}
.note{border-radius:10px;padding:9px 13px;font-size:13.5px;margin:10px 0}.note.warn{background:var(--warnbg);color:var(--warn)}.note.info{background:var(--infobg);color:var(--info)}.note.good{background:var(--goodbg);color:var(--good)}
#sJob{white-space:normal;text-align:left}
.thread{display:flex;flex-direction:column;gap:10px;min-height:240px;max-height:62vh;overflow:auto;padding:4px 2px}
.msg{max-width:min(78ch,92%);padding:10px 14px;border-radius:14px;line-height:1.5;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.you{align-self:flex-end;background:var(--acc2);color:var(--ink);border-bottom-right-radius:4px}
.msg.model{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg.job{align-self:stretch;max-width:100%;background:var(--panel);border:1px solid var(--line);padding:0}
.msg.job .term{height:160px;margin:0;border-radius:0 0 14px 14px}
.msg .who{display:block;font-size:11.5px;color:var(--mute);margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
.msg.job .who{padding:8px 14px 0}.msg .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.check{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.check:last-child{border:0}
.tick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;background:var(--soft);color:var(--mute)}.tick.ok{background:var(--goodbg);color:var(--good)}
.gs{display:grid;gap:2px;margin-top:10px}
.gs-step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--rs);border:1px solid transparent}
.gs-step.now{background:var(--acc2);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.gs-step .tick{width:28px;height:28px;font:600 13px/1 var(--font-head)}
.gs-step.now .tick{background:var(--acc);color:var(--on-acc)}
.gs-step.done b{color:var(--mute);font-weight:500}
.gs-step p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.gs-bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:6px}.gs-bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
@media (max-width:560px){.gs-step{grid-template-columns:28px minmax(0,1fr)}.gs-step .btn{grid-column:2;justify-self:start}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;max-width:90vw;box-shadow:0 8px 30px #0005;border-left:3px solid transparent;animation:toastIn .2s ease-out}
.toast.ok{border-left-color:var(--good)}.toast.err{border-left-color:var(--bad)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.chip.live{position:relative;padding-left:20px}
.chip.live::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--info);transform:translateY(-50%);box-shadow:0 0 0 0 var(--info);animation:livePulse 1.6s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(90,140,255,.55)}70%{box-shadow:0 0 0 7px rgba(90,140,255,0)}100%{box-shadow:0 0 0 0 rgba(90,140,255,0)}}
#view{animation:viewIn .16s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--acc2)}
.modal{position:fixed;inset:6% 6%;z-index:40;overflow:auto;box-shadow:0 20px 70px #0007}
pre.cmd{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;font:12.5px var(--mono);margin:8px 0}
code{font-family:var(--mono);background:var(--soft);padding:1px 6px;border-radius:6px;font-size:12.5px}
details>summary{cursor:pointer;color:var(--mute);padding:4px 0}
.mhead{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px}.mhead .name{font-weight:700;font-size:16px;word-break:break-all}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
@media (min-width:821px){.term-card{position:sticky;top:12px;z-index:1}}

/* ---------- the blueprint sheet (Home) ---------- */
.sheet{position:relative;background:var(--bp);color:var(--bpink);border-radius:var(--r);padding:clamp(22px,3.2vw,40px);margin-bottom:18px;overflow:hidden;border:1px solid #1b4bb0}

.sheet::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--bpline) 1px,transparent 1px),linear-gradient(90deg,var(--bpline) 1px,transparent 1px);background-size:140px 140px;opacity:.35;pointer-events:none}
.sheet>*{position:relative;z-index:1}
.sheet .frame{position:absolute;inset:12px;border:1px solid rgba(191,212,255,.45);border-radius:6px;pointer-events:none;z-index:0}
.sheet h1{margin:0 0 10px;font:600 clamp(30px,4.4vw,52px)/1.02 var(--font-head);letter-spacing:-.9px;max-width:14ch;color:#fff}
.sheet .lede{margin:0 0 22px;max-width:52ch;color:var(--bpmute);font-size:15.5px;line-height:1.55}
.sheet .cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.sheet .cols{grid-template-columns:1fr}}
.pins{display:grid;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.pins li{display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:baseline;font-size:14px;color:#fff}
.pins li i{display:block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--bpmute);transform:translateY(1px)}
.pins li.ok i{background:#5fd38a;border-color:#5fd38a}.pins li.no i{background:#ff9a63;border-color:#ff9a63}
.pins li span{color:var(--bpmute)}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap}
.sheet .btn{background:transparent;color:#fff;border-color:rgba(191,212,255,.55)}.sheet .btn:hover:not(:disabled){border-color:#fff;background:rgba(255,255,255,.06)}
.sheet .btn.p{background:#fff;color:var(--bp);border-color:#fff}.sheet .btn.p:hover:not(:disabled){background:#eaf1ff}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
.crew figure{margin:0;text-align:center}
.crew svg{width:100%;height:auto;display:block;border-radius:8px;background:rgba(255,255,255,.04)}
.crew figcaption{font-size:12px;line-height:1.3;margin-top:6px;color:#fff}.crew figcaption span{display:block;color:var(--bpmute);font:11px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crew .more{display:grid;place-items:center;font-size:13px;color:var(--bpmute);border:1px dashed rgba(191,212,255,.5);border-radius:8px;aspect-ratio:1;cursor:pointer;align-self:start}.crew .more:hover{border-color:#fff;color:#fff}
.tblock{display:grid;grid-template-columns:repeat(3,auto);gap:0;border:1px solid rgba(191,212,255,.5);border-radius:6px;margin-top:24px;font-size:12px;width:max-content;max-width:100%;overflow:hidden}
.tblock div{padding:7px 12px;border-right:1px solid rgba(191,212,255,.5);color:var(--bpmute)}.tblock div:last-child{border-right:0}.tblock b{display:block;color:#fff;font-weight:500;font-family:var(--mono);font-size:12.5px}
.sheet-wrap .top{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- iconography: one inline sprite, no network, inherits colour and weight ---------- */
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.ic.lg{width:1.5em;height:1.5em}
.nav .ic{width:17px;height:17px;opacity:.9}
.nav[aria-current=page] .ic{opacity:1}
.brandmark{width:28px;height:28px;flex:none;border-radius:7px;background:var(--bp);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--bpline)}
.brandmark svg{width:18px;height:18px;stroke:var(--bpink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the status strip: one glance says what the machine is doing ---------- */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;padding:9px 14px;margin:0 0 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);font-size:12.5px;color:var(--mute)}
.strip b{color:var(--ink);font-weight:650}
.strip .sg{display:flex;align-items:center;gap:7px;white-space:nowrap}
.strip .sep{width:1px;height:16px;background:var(--line);flex:none}
.strip .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.dot.on{background:var(--good)}
.dot.busy{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
.dot.off{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.meter{width:84px;height:5px;border-radius:999px;background:var(--soft);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .4s ease}
.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--bad)}
.killbtn{margin-left:auto}

/* ---------- the console: conversation on the left, what it is doing on the right ---------- */
.console{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr);gap:14px;align-items:start}
.thread{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;
  min-height:clamp(380px,58vh,760px);max-height:78vh}
.msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;animation:msgIn .2s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg .who{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:650 11px/1 var(--font-head);flex:none}
.msg.you .who{background:var(--soft);color:var(--mute)}
.msg.arch .who{background:var(--acc2);color:var(--acc)}
.msg .body{min-width:0;overflow-wrap:anywhere}
.msg .body p{margin:0 0 8px}.msg .body p:last-child{margin:0}
.msg .body pre{background:var(--soft);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;overflow-x:auto;font:12.5px/1.5 var(--mono);margin:8px 0}
.msg .body code{background:var(--soft);border-radius:4px;padding:1px 5px;font:12.5px var(--mono)}
.msg .body pre code{background:none;padding:0}
.msg .meta{color:var(--faint);font-size:11.5px;margin-top:5px;font-variant-numeric:tabular-nums}
.composer{border-top:1px solid var(--line);padding:11px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:end;background:var(--panel);border-radius:0 0 var(--r) var(--r)}
.composer textarea{width:100%;min-height:46px;max-height:200px;resize:vertical;border:1px solid var(--line);border-radius:var(--rs);
  background:var(--bg);color:var(--ink);font:inherit;padding:11px 12px;line-height:1.5}
.composer textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.composer .hint{grid-column:1/-1;color:var(--faint);font-size:11.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
kbd{font:11px/1.4 var(--mono);background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--mute)}

/* the live panel */
.doing{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:sticky;top:16px;
  max-height:78vh;overflow-y:auto}
.doing h3{margin:0;padding:13px 16px 11px;font:650 11.5px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--panel);z-index:1}
.doing .sect{padding:13px 16px;border-bottom:1px solid var(--line)}
.doing .sect:last-child{border-bottom:0}
.doing .lbl{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.plan li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;align-items:start;padding:4px 0;font-size:13px;color:var(--mute);border-radius:6px}
.plan li .ic{margin-top:1px}
.plan li.done{color:var(--ink)}.plan li.done .ic{color:var(--good)}
.plan li.now{color:var(--ink);font-weight:600}.plan li.now .ic{color:var(--acc)}
.plan li.fail .ic{color:var(--bad)}.plan li.unsure .ic{color:var(--warn)}
.plan li.skip{color:var(--faint);text-decoration:line-through}
.plan li[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.plan li.sel{background:var(--acc2)}
.tools{list-style:none;margin:0;padding:0;display:grid;gap:5px;font:12px/1.45 var(--mono)}
.tools li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start;color:var(--mute)}
.tools li .ic{width:13px;height:13px;margin-top:2px}
.tools li.ok .ic{color:var(--good)}.tools li.no .ic{color:var(--bad)}
.tools b{color:var(--ink);font-weight:600}
.tools .res{color:var(--faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gates{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12.5px}
.gates li{display:grid;grid-template-columns:15px minmax(0,1fr) auto;gap:8px;align-items:center}
.gates .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.gates .v{font-size:11px;font-weight:650;padding:1px 7px;border-radius:999px}
.gates .v.ok{background:var(--goodbg);color:var(--good)}
.gates .v.no{background:var(--badbg);color:var(--bad)}
.gates .v.un{background:var(--warnbg);color:var(--warn)}
.verdictbox{display:flex;align-items:center;gap:10px;padding:13px 16px;font-weight:650;font-size:13.5px}
.verdictbox.pass{background:var(--goodbg);color:var(--good)}
.verdictbox.fail{background:var(--badbg);color:var(--bad)}
.verdictbox.not_sure{background:var(--warnbg);color:var(--warn)}
.pmcard{border-left:3px solid var(--bad);padding:4px 0 4px 14px;display:grid;gap:6px;font-size:13px;line-height:1.5}
.pmcard p{margin:0}
.pmcard .next b{color:var(--ink)}
.idle{padding:28px 18px;text-align:center;color:var(--faint);font-size:13px;display:grid;gap:9px;place-items:center}
.idle .ic{width:26px;height:26px;opacity:.5}

/* ---------- command palette ---------- */
.palette{position:fixed;inset:0;background:var(--veil);display:grid;place-items:start center;padding:12vh 16px 16px;z-index:60;
  animation:fadeIn .12s ease-out;backdrop-filter:blur(2px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.palette .box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 24px 70px -18px rgba(2,6,16,.5);overflow:hidden;animation:popIn .14s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:15px var(--font);padding:14px 16px}
.palette input:focus{outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow-y:auto}
.palette li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 10px;border-radius:var(--rs);cursor:pointer;font-size:13.5px}
.palette li .sub2{color:var(--faint);font-size:11.5px}
.palette li[aria-selected=true]{background:var(--acc2);color:var(--acc)}
.palette li[aria-selected=true] .sub2{color:var(--acc)}
.palette .empty{padding:22px 16px;color:var(--faint);font-size:13px;text-align:center}

/* ---------- one set of breakpoints, not three ---------- */
@media (max-width:1000px){.console{grid-template-columns:minmax(0,1fr)}.doing{position:static;max-height:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;scroll-behavior:auto!important}}

/* the one screen earns its space: no page heading above it, and the two columns match in height */
body.oneScreen .top{display:none}
body.oneScreen main{padding-top:18px}
body.oneScreen .subtabs{margin-bottom:12px}
.console{align-items:stretch}
.console>.doing{min-height:clamp(380px,58vh,760px)}
.thread{height:100%}
.composer .hint{gap:0;row-gap:7px;margin-top:3px;align-items:center}
.composer .hint .grow{flex:1 1 20px}
.composer .hint .pair{display:inline-flex;align-items:center;gap:4px;margin-right:16px;white-space:nowrap}
.composer .hint .pair kbd+kbd{margin-left:-1px}
.composer .hint .pair>kbd:last-of-type{margin-right:3px}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;width:100%;max-width:520px;margin-top:4px}
.starts button{text-align:left;padding:10px 12px;white-space:normal;line-height:1.4;display:flex;gap:9px;align-items:flex-start}
.starts button .ic{margin-top:2px;color:var(--acc);opacity:.85}
.idle.hero{gap:12px;padding:34px 20px}
.idle.hero .lead{font:600 17px/1.3 var(--font-head);color:var(--ink)}
.idle.hero .why{max-width:42ch;line-height:1.6}

/* slash commands: the list appears above the box you are typing in, like a real prompt */
.slash{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 18px 50px -16px rgba(2,6,16,.45);overflow:hidden;z-index:5;animation:popIn .12s ease-out}
.slash ul{list-style:none;margin:0;padding:5px;max-height:260px;overflow-y:auto}
.slash li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 9px;
  border-radius:var(--rs);cursor:pointer;font-size:13px}
.slash li b{font-family:var(--mono);font-size:12.5px;color:var(--acc)}
.slash li .d{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slash li .fl{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.slash li[aria-selected=true]{background:var(--acc2)}
.slash li[aria-selected=true] .d{color:var(--ink)}
.composer{position:relative}

/* ---------- tiers: one card per job, the recommendation beside what is in use ---------- */
.teamhead{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.teamhead .grow{min-width:240px}
.teamhead h2{margin:0 0 3px}
.hwpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hwpills span{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--mute)}
.hwpills b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.tiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px;margin-bottom:14px}
.tiercard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 17px 15px;
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.tiercard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--line)}
.tiercard.t-worker::before{background:var(--acc)}.tiercard.t-router::before{background:var(--code)}
.tiercard.t-heavy::before{background:var(--llm)}.tiercard.t-draft::before{background:var(--judge)}
.tiercard.custom{border-color:var(--acc)}
.tc-head{display:flex;align-items:center;gap:9px}
.tc-head b{font:650 15px/1.2 var(--font-head)}
.tc-head .chip{margin-left:auto}
.tc-badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--acc);flex:none}
.t-router .tc-badge{color:var(--code)}.t-heavy .tc-badge{color:var(--llm)}.t-draft .tc-badge{color:var(--judge)}
.tc-what{margin:0;color:var(--mute);font-size:13px;line-height:1.5}
.tc-rec{background:var(--soft);border-radius:var(--rs);padding:10px 11px}
.tc-rec .model{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere;margin:2px 0 4px}
.tc-rec p{margin:0;font-size:12px;line-height:1.5;color:var(--mute)}
.lbl{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.vram{display:grid;gap:4px}
.vram .bar{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;display:flex}
.vram .bar i{display:block;height:100%;background:var(--acc)}
.vram .bar i.ram{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,transparent 4px,transparent 8px);opacity:.7}
.vram .legend{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tc-pick{display:grid;gap:5px;margin-top:auto}
.tc-pick select{width:100%;font:12.5px var(--mono);padding:7px 8px;border-radius:var(--rs);border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tc-facts{display:flex;flex-wrap:wrap;gap:5px}
.tc-facts span{font-size:11px;font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute)}
/* ---------- the queue ---------- */
.qadd{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;margin:4px 0 14px}
.qadd input,.qadd select{font:inherit;padding:9px 11px;border-radius:var(--rs);border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.qstats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.qstats span{background:var(--soft);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--mute)}
.qstats b{color:var(--ink);font-variant-numeric:tabular-nums}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.qlist li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border:1px solid var(--line);border-radius:var(--rs);background:var(--panel)}
.qlist li .ic{margin-top:2px}
.qlist li.done .ic{color:var(--good)}.qlist li.failed .ic,.qlist li.dead .ic{color:var(--bad)}
.qlist li.not_sure .ic{color:var(--warn)}.qlist li.running .ic{color:var(--acc)}.qlist li.cancelled{opacity:.55}
.qlist .goal{font-size:13.5px;color:var(--ink)}
.qlist .meta{font-size:11.5px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.qlist .note{font-size:12px;color:var(--mute);margin-top:4px}
.setupcard{border:1px solid var(--acc);background:linear-gradient(135deg,var(--acc2),transparent 70%);border-radius:var(--r);padding:16px 18px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin:0 0 14px;text-align:left}
.setupcard .ic{width:26px;height:26px;color:var(--acc)}
.setupcard b{display:block;font:650 15px/1.3 var(--font-head);margin-bottom:2px}
.setupcard p{margin:0;color:var(--mute);font-size:13px}
@media (max-width:700px){.qadd{grid-template-columns:1fr}.setupcard{grid-template-columns:1fr}}

/* =====================================================================================================
   IDENTITY. Architect draws plans before it builds, so the interface looks like a drafting table:
   an engineering typeface, a faint construction grid, registration ticks on every sheet, numbered
   callouts. Every font below already ships with the operating system -- nothing is downloaded.
   Bahnschrift is the DIN-style face on every Windows 10/11 machine; the rest are fallbacks.
   ===================================================================================================== */
:root{
  --font-head:"Bahnschrift","DIN Alternate","DIN Next","Avenir Next Condensed","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:"Cascadia Code","Cascadia Mono","JetBrains Mono","SF Mono",ui-monospace,Consolas,monospace;
  --grid:rgba(21,73,201,.045);--grid2:rgba(21,73,201,.075);--tick:rgba(21,73,201,.38);
  --paper:#f6f5f0;--panel:#fffffd;--line:#dcdfe6;--soft:#eef0f3}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --grid:rgba(125,162,255,.045);--grid2:rgba(125,162,255,.08);--tick:rgba(125,162,255,.45);--paper:#08111f}}
:root[data-theme=dark]{--grid:rgba(125,162,255,.045);--grid2:rgba(125,162,255,.08);--tick:rgba(125,162,255,.45);--paper:#08111f}
:root[data-theme=light]{--paper:#f6f5f0;--panel:#fffffd}

/* accent themes: the whole app follows one colour */
:root[data-accent=graphite]{--acc:#3c4656;--acc2:#e7e9ed;--info:#3c4656;--tick:rgba(60,70,86,.35);--grid:rgba(60,70,86,.04);--grid2:rgba(60,70,86,.07)}
:root[data-accent=copper]{--acc:#b4531f;--acc2:#f8e7dc;--info:#b4531f;--tick:rgba(180,83,31,.38);--grid:rgba(180,83,31,.04);--grid2:rgba(180,83,31,.07)}
:root[data-accent=moss]{--acc:#2f7a4f;--acc2:#e1f1e7;--info:#2f7a4f;--tick:rgba(47,122,79,.38);--grid:rgba(47,122,79,.04);--grid2:rgba(47,122,79,.07)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light])[data-accent=graphite]{--acc:#b7c1d1;--acc2:#222b38}
  :root:not([data-theme=light])[data-accent=copper]{--acc:#f0995f;--acc2:#3a2416}
  :root:not([data-theme=light])[data-accent=moss]{--acc:#73d39a;--acc2:#15301f}}
:root[data-theme=dark][data-accent=graphite]{--acc:#b7c1d1;--acc2:#222b38}
:root[data-theme=dark][data-accent=copper]{--acc:#f0995f;--acc2:#3a2416}
:root[data-theme=dark][data-accent=moss]{--acc:#73d39a;--acc2:#15301f}

/* the construction grid on the drafting surface */
main{background:
  linear-gradient(var(--grid2) 1px,transparent 1px) 0 0/120px 120px,
  linear-gradient(90deg,var(--grid2) 1px,transparent 1px) 0 0/120px 120px,
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px;max-width:none}
main>*{max-width:1320px}
body{background:var(--bg)}
:root:not([data-theme=dark]) body{background:var(--paper)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) body{background:var(--paper)}}

/* registration ticks: every sheet on the table is pinned at its corners */
.card,.thread,.doing,.strip,.tiercard{position:relative}
.card::after,.thread::after,.doing::after,.tiercard::after{content:"";position:absolute;inset:3px;pointer-events:none;border-radius:inherit;
  background:
    linear-gradient(var(--tick),var(--tick)) top left/10px 1px no-repeat,
    linear-gradient(var(--tick),var(--tick)) top left/1px 10px no-repeat,
    linear-gradient(var(--tick),var(--tick)) top right/10px 1px no-repeat,
    linear-gradient(var(--tick),var(--tick)) top right/1px 10px no-repeat,
    linear-gradient(var(--tick),var(--tick)) bottom left/10px 1px no-repeat,
    linear-gradient(var(--tick),var(--tick)) bottom left/1px 10px no-repeat,
    linear-gradient(var(--tick),var(--tick)) bottom right/10px 1px no-repeat,
    linear-gradient(var(--tick),var(--tick)) bottom right/1px 10px no-repeat}
.tiercard{overflow:visible}

/* typography: the engineering face for everything that is a name, a label or a number */
.top h1,.card h2,.tc-head b,.idle.hero .lead,.setupcard b,.brand,.nav,.subtabs button{font-family:var(--font-head);letter-spacing:.01em}
.top h1{font-weight:600;font-size:27px;letter-spacing:.005em}
.strip,.strip b,.num,.meter+span,.qstats b,.k b,.vram .legend,.msg .meta{font-family:var(--font-head);font-variant-numeric:tabular-nums}
.strip{font-size:13px;letter-spacing:.02em}
code,kbd,pre,.mono{font-family:var(--mono)}

/* the brand: a wordmark, and what kind of tool this is */
.brand{flex-direction:row;align-items:center;gap:11px;padding:6px 10px 20px}
.brand>span:nth-child(2){font:600 17px/1 var(--font-head);letter-spacing:.16em;text-transform:uppercase}
.brand .sub{display:block;font:500 9.5px/1 var(--font-head);letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.brandmark{width:32px;height:32px;border-radius:7px;background:var(--bp);
  background-image:linear-gradient(var(--bpline) 1px,transparent 1px),linear-gradient(90deg,var(--bpline) 1px,transparent 1px);
  background-size:6px 6px;box-shadow:inset 0 0 0 1px var(--bpline),0 1px 0 rgba(0,0,0,.08)}

/* section labels look like the title block of a drawing: a number, a rule, a name */
.doing h3{font-family:var(--font-head);letter-spacing:.18em;font-size:11px}
.lbl,.doing .lbl{font-family:var(--font-head);letter-spacing:.16em}
.doing .sect>.lbl{display:flex;align-items:center;gap:8px}
.doing .sect>.lbl::before{content:attr(data-n);color:var(--acc);font-weight:700}
.doing .sect>.lbl::after{content:"";flex:1;height:1px;background:var(--line)}

/* the plan is a drawing schedule: numbered callouts on a dimension line */
.plan{position:relative;padding-left:2px;counter-reset:pl}
.plan::before{content:"";position:absolute;left:10px;top:12px;bottom:12px;width:1px;
  background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 7px)}
.plan li{counter-increment:pl;grid-template-columns:21px minmax(0,1fr);padding:5px 4px 5px 0;position:relative}
.plan li>.ic{width:19px;height:19px;padding:3px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 1px var(--line);z-index:1}
.plan li.done>.ic{box-shadow:0 0 0 1.5px var(--good)}
.plan li.now>.ic{box-shadow:0 0 0 2px var(--acc);animation:pulse 1.6s ease-in-out infinite}
.plan li.fail>.ic{box-shadow:0 0 0 1.5px var(--bad)}
.plan li.unsure>.ic{box-shadow:0 0 0 1.5px var(--warn)}

/* the empty drafting table: a technical drawing instead of a sparkle */
.blueprint-art{width:min(300px,80%);height:auto;color:var(--acc);opacity:.92;margin-bottom:4px}
.blueprint-art .ink{stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.blueprint-art .thin{stroke:currentColor;fill:none;stroke-width:.7;opacity:.55}
.blueprint-art .dim{stroke:currentColor;stroke-width:.7;opacity:.7;fill:none}
.blueprint-art text{fill:currentColor;font:600 7.5px var(--font-head);letter-spacing:.12em;opacity:.8}
.blueprint-art .face1{fill:currentColor;opacity:.07}.blueprint-art .face2{fill:currentColor;opacity:.13}

/* accent picker */
.accents{display:flex;gap:6px;padding:2px 2px 0}
.accents button{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.accents button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.accents button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* buttons get a little more presence */
.btn.pri{font-family:var(--font-head);letter-spacing:.04em}
.btn.pri .ic{margin-left:2px}
.starts button{border-style:dashed}
.starts button:hover{border-style:solid;border-color:var(--acc)}

/* ---------- the Start gallery ---------- */
.tfilter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tfilter button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--mute);
  font:500 12.5px var(--font-head);letter-spacing:.04em;padding:6px 12px;border-radius:999px;cursor:pointer}
.tfilter button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.tfilter .n{font-variant-numeric:tabular-nums;opacity:.7}
.tgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
  overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s;position:relative;text-align:left}
.tcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.tcard:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tcard[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2),var(--shadow)}
.tcard .plate{height:74px;position:relative;display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--line);
  background:linear-gradient(var(--grid2) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,var(--grid2) 1px,transparent 1px) 0 0/12px 12px,var(--soft)}
.tcard .plate .ic{width:34px;height:34px;color:var(--acc);stroke-width:1.4}
.tcard .plate .cat{font:600 10.5px var(--font-head);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.tcard .plate .no{position:absolute;right:12px;top:10px;font:600 10px var(--font-head);letter-spacing:.12em;color:var(--faint)}
.tcard .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.tcard h3{margin:0;font:600 15px/1.3 var(--font-head)}
.tcard p{margin:0;font-size:12.5px;line-height:1.5;color:var(--mute);flex:1}
.tcard .foot{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tcard .foot span{font:11px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute)}
.tcard .sel{position:absolute;right:10px;bottom:10px;color:var(--acc)}

/* workflow map: the steps of a flow as a living timeline */
.fm-card{margin-top:12px;padding:16px 18px;border:1px solid var(--line,rgba(127,127,127,.25));border-radius:14px;background:var(--panel,transparent)}
.fm-head{display:flex;gap:6px;align-items:baseline;margin-bottom:4px}
.fm-blurb{margin:4px 0 10px;font-size:13px;line-height:1.5}
.fm{list-style:none;margin:0;padding:0;position:relative}
.fm::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(var(--accent,#6c8cff),transparent)}
.fm-step{display:flex;gap:12px;padding:8px 0;opacity:0;transform:translateY(4px);animation:fmIn .35s ease forwards;animation-delay:calc(var(--i)*60ms)}
.fm-dot{flex:none;width:16px;height:16px;border-radius:50%;margin-top:2px;border:2px solid var(--accent,#6c8cff);background:var(--bg,#fff);position:relative;z-index:1}
.fm-dot.c{border-color:var(--muted,#888)}
.fm-title{font-weight:600;font-size:14px}
.fm-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
@keyframes fmIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fm-step{animation:none;opacity:1;transform:none}}

/* ===== polish layer (2026-11-04): fonts that ship with the OS, type scale, depth, life ===== */
:root{--font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Inter",Roboto,sans-serif;
--font-head:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
--mono:"Cascadia Code","Cascadia Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--t-xs:12px;--t-s:13px;--t-m:14px;--t-l:16px;--t-xl:20px;--t-2xl:26px;--ease:cubic-bezier(.2,.7,.2,1);
--lift:0 1px 0 rgba(14,26,51,.04),0 14px 34px -18px rgba(14,26,51,.28);--ring:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
body{font-feature-settings:"ss01","cv11";letter-spacing:-.005em;
  background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--acc) 7%,transparent),transparent 60%),
             radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--llm) 6%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.top h1{font:650 var(--t-2xl)/1.15 var(--font-head);letter-spacing:-.6px}
.card h2,.card h3{font-family:var(--font-head);letter-spacing:-.2px}
.card{transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease)}
.card:hover{box-shadow:var(--lift);border-color:color-mix(in srgb,var(--acc) 22%,var(--line))}
button,.btn{transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease),box-shadow .15s var(--ease)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.p{box-shadow:0 6px 18px -8px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn.p:hover{box-shadow:0 10px 24px -10px color-mix(in srgb,var(--acc) 80%,transparent)}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--rs)}
input,select,textarea{transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:var(--ring);outline:none}
.chip{transition:background-color .2s var(--ease),color .2s var(--ease)}
.chip.live,.chip.info.live{position:relative;padding-left:20px}
.chip.live::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:currentColor;animation:livePulse 1.4s var(--ease) infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.nav{transition:background-color .15s var(--ease),color .15s var(--ease)}
.nav .g{transition:transform .2s var(--ease)}.nav:hover .g{transform:translateX(2px)}
code,pre,.mono,#term{font-family:var(--mono);font-variant-ligatures:contextual}
#term{line-height:1.55}
.note{border-radius:var(--rs)}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mute) 35%,transparent);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--mute) 55%,transparent);background-clip:padding-box;border:2px solid transparent}
.skeleton{background:linear-gradient(90deg,var(--soft) 25%,color-mix(in srgb,var(--soft) 60%,var(--panel)) 37%,var(--soft) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--rs)}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.idle.hero{min-width:0;max-width:100%;box-sizing:border-box}
.starts{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));width:100%;max-width:min(520px,100%);min-width:0}
.starts>.btn{min-width:0}
#cMsgs>.idle{width:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* steps still to come in the live plan */
ul.plan li.todo{opacity:.5}ul.plan li.todo svg{opacity:.4}
/* machine map */
.mm-top{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:12px}.mm-top h2{margin:0;font:650 var(--t-xl,20px)/1.2 var(--font-head)}
.mm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px}
.mm-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:color-mix(in srgb,var(--panel) 85%,var(--soft));display:flex;flex-direction:column;gap:8px;min-width:0}
.mm-h{display:flex;gap:10px;align-items:center}.mm-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--acc2);color:var(--acc);flex:none;font-size:15px}
.mm-bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.mm-bar span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--llm)));transition:width .6s var(--ease,ease)}
.mm-list{display:grid;gap:6px}.mm-model{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}.mm-model .mm-dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.mm-model.up .mm-dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.mm-role{font-size:12.5px;color:var(--mute)}.mm-role.none b{color:var(--bad)}.mm-role.models b{color:var(--good)}

/* Start: one guided flow */
.sflow{padding:24px 26px}.sflow-head{margin-bottom:8px}
.sstep{padding:18px 0;border-top:1px solid var(--line)}.sstep:first-of-type{border-top:0}
.sstep-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.sstep-h h3{margin:0;font:650 var(--t-l,16px)/1.3 var(--font-head)}.sstep-h p{margin:2px 0 0}
.sstep-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;
  background:var(--acc2);color:var(--acc)}
.sgoal{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);color:var(--ink);resize:vertical}
.smore{margin:6px 0 4px;padding:10px 0;border-top:1px solid var(--line)}.smore summary{cursor:pointer;color:var(--mute);font-size:14px}
.smore[open] summary{margin-bottom:12px}.saddons{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;align-items:center}
.sfoot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.sgo{padding:11px 22px;font-size:15px}

.sdetail{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin:4px 0 6px;padding:16px;border:1px solid var(--line);border-radius:var(--rs);background:var(--panel)}
.sdetail h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.sd-files{margin:8px 0 0;padding-left:16px;max-height:180px;overflow:auto;font-size:13px}.sd-ideas{display:flex;flex-wrap:wrap;gap:6px}
.sidea{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);text-align:left}.sidea:hover{border-color:var(--acc);color:var(--acc)}
.stl-i{display:flex;gap:10px;padding:6px 0}.stl-n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--acc2);color:var(--acc);font-size:11px;font-weight:700;display:grid;place-items:center}

.fm-more{margin-top:4px}.fm-more summary{cursor:pointer;font-size:12px;color:var(--mute)}.fm-more div{margin-top:3px}
.reqs{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:var(--rs);display:grid;gap:6px}.req{display:flex;gap:10px;align-items:center}
.facets{margin-top:6px;display:grid;gap:4px;font-weight:400}.fct{margin-right:6px}.wprog{display:flex;gap:10px;align-items:center;margin:0 0 8px}.wprog .meter{flex:1}

@media (max-width:820px){aside{align-items:center;gap:4px}#nav{display:flex;flex-direction:row;flex-wrap:wrap;gap:4px;height:auto}aside .nav{min-height:0;height:auto;padding:6px 10px;font-size:13px}.nav::before{display:none}}

.btiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.btile{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--rs);background:var(--panel)}
.btile b{font-size:26px;font-weight:700;letter-spacing:-.02em}.btile.good b{color:var(--good,#3fb950)}.btile.warn b{color:var(--warn,#d29922)}.btile.bad b{color:var(--bad,#f85149)}

.livetxt{max-height:150px;overflow:auto;white-space:pre-wrap;font:12px/1.45 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;margin:0 0 4px}
.lane{display:grid;grid-template-columns:56px 1fr 44px;gap:8px;align-items:center;margin:4px 0}.lane-n{font-size:12px;color:var(--mute)}
.lane-bar{position:relative;height:12px;border-radius:6px;background:var(--line)}.lane-b{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--acc)}
.lane-b.router{background:#8b949e}.lane-b.heavy{background:#d29922}.lane-b.cloud{background:#d97757}
.iters{margin:4px 0 0;padding-left:18px;display:grid;gap:3px}.iters li.ok b{color:var(--good,#3fb950)}.iters li.no b{color:var(--bad,#f85149)}
.pulse{color:var(--acc);display:inline-flex;align-items:center}

ul.plan .iters li{display:block;padding:2px 0;border:0;background:none;font-weight:400}ul.plan .iters li b{font-weight:600}
</style>

<script>
"use strict";
const TOKEN="__HUB_TOKEN__";
const $=(s,r=document)=>r.querySelector(s);
/* One sprite, referenced by name. Nothing is fetched, the colour is inherited, and it stays crisp at any zoom. */
function icon(name,cls){const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('class','ic'+(cls?' '+cls:''));e.setAttribute('aria-hidden','true');e.setAttribute('focusable','false');const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#i-'+name);e.append(u);return e;}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v===false||v==null) continue;
    if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="html") e.innerHTML=v;
    else if(k in e&&k!=="list"&&k!=="style"){ try{e[k]=v;}catch(_){e.setAttribute(k,v);} } else e.setAttribute(k,v);
  }
  for(const c of kids.flat(2)){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function toast(m,ms=3800,cls="ok"){const t=$("#toast");t.textContent=m;t.className="toast "+cls;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);}
toast.err=(m,ms=3800)=>toast(m,ms,"err");
async function api(path,body){
  const o=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json","X-Hub-Token":TOKEN},body:JSON.stringify(body)};
  const r=await fetch(path,o); let j={}; try{j=await r.json();}catch(_){}
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j;
}
const fmt=(n,d=1)=>n==null?"–":Number(n).toFixed(d);
const sc=s=>s==null?"s-na":s>=75?"s-hi":s>=45?"s-mid":"s-lo";
const cell=v=>v==null?h("span",{class:"cell s-na"},"–"):h("span",{class:"cell "+sc(v),style:"font-weight:650"},fmt(v,0));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(_){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}}};

let S=null, cfg={}, dirty=false, page="console", weights={};
const opts={kv:"f16",gpu_bw:192,ram_bw:50,vram:"",ram:""};
const run={tpl:"",tplTarget:"",root:store.get("root",""),app:"",flow:"auto",review:"ask",domains:[],goal:"",template:"auto",name:"",addons:[],thenBuild:true,autofix:false,options:{}};
const sel={models:new Set(),cats:null,think:false};
/* Groups and the tabs inside them are ordered the way a first run through the hub actually goes:
   check the machine, build the team, build and run the project, then measure and manage it over time. */
const NAV_GROUPS=[
  ["0. Console",[["console","console","Console","Ask for something and watch it happen"],["studio","chat","Studio","Talk it through with your model, then hand it to the team"]]],
  ["1. Set up",[["tiers","layers","Tiers","Which installed model does which job on this machine, and why"],["overview","⌂","Overview","Your local engineering team at a glance"],["doctor","✚","Doctor","Real checks: Python, Ollama, disk, port, git, NIC, network -- run this first"],["models","▤","Models","What is installed and how it fits this PC"],["roles","◎","Roles","Who does what, and which model should do it"]]],
  ["2. Build",[["start","✦","Start","Begin a project from nothing: pick a starting point"],["run","▶","Task","Give the team a goal"],["queue","play","Queue","Tasks the machine works through on its own, trying another approach when one fails"],["launch","⏻","Launch","Start/stop your project for real and see if it's actually alive"]]],
  ["3. Measure",[["tune","◆","Tune","Fit this machine, upgrades worth adding, fake code and self-improvement"],["assess","◈","Assess","Is this machine + model lineup actually ready, per workload"],["advisor","✺","Advisor","Doctor + assess + a real code scan, combined into ranked next steps"],["score","▦","Scoreboard","Measured strengths per model"],["bench","◔","Benchmarks","Pass rate over time, live and scripted, and the last live run task by task"],["flows","⇄","Flows","The workflows and the checks inside them"]]],
  ["4. Manage",[["portfolio","❖","Portfolio","Your apps and how they connect"],["settings","⚙","Settings","Limits, behaviour and tests"],["train","↻","Training","Turn verified work into training data"]]],
];
const PAGES=NAV_GROUPS.flatMap(([,items])=>items);
/* Five places instead of fourteen pages. Every old page id still works (go("run") etc.); a tab just groups the pages that belong together. */
/* Four places. Projects: where you start (and the Get started checklist). Workspace: ask for something and watch it happen. Models:
   which models do the work and how well they measure. Settings: everything that tunes the machine. Every old page id still works. */
const TABS=[
  ["home","home","Projects",["overview","start","portfolio"]],
  ["console","console","Workspace",["console","run","studio","queue","launch"]],
  ["team","layers","Models",["tiers","bench","score","models","roles"]],
  ["settings","gear","Settings",["settings","tune","doctor","assess","advisor","flows","train"]],
];
const SUBNAME={console:"Console",studio:"Chat about the code",tiers:"Your models",queue:"Queue",overview:"Home",run:"New task",start:"Start a project",launch:"Run the app",flows:"Workflows",portfolio:"All projects",models:"Installed",roles:"Specialists",score:"Scoreboard",tune:"Tune & improve",doctor:"Checkup",assess:"Readiness",advisor:"Advisor",bench:"Benchmarks",settings:"Settings",train:"Training data"};
const tabOf=id=>TABS.find(t=>t[3].includes(id))||TABS[0];

function buildNav(){
  const n=$("#nav");n.innerHTML="";const cur=tabOf(page);
  for(const t of TABS)n.append(h("button",{class:"nav","aria-current":t===cur?"page":false,onclick:()=>go(t[3][0])},icon(t[1]),t[2]));
  const sb=$("#subtabs");sb.innerHTML="";
  if(cur[3].length>1)for(const id of cur[3])sb.append(h("button",{"aria-current":id===page?"page":false,onclick:()=>go(id)},SUBNAME[id]||id));
}
function go(id){page=id;buildNav();document.body.classList.toggle("sheet-wrap",id==="overview");document.body.classList.toggle("oneScreen",id==="console");const p=PAGES.find(x=>x[0]===id);$("#pageTitle").textContent=p[2];$("#pageSub").textContent=p[3];$("#pageActions").innerHTML="";built={};render();const v=$("#view");v.style.animation="none";void v.offsetWidth;v.style.animation="";if(id==="run")pollJob();window.scrollTo(0,0);}
let built={};

async function refresh(force){
  const q=new URLSearchParams({kv:opts.kv,gpu_bw:opts.gpu_bw,ram_bw:opts.ram_bw}); if(opts.vram)q.set("vram",opts.vram); if(opts.ram)q.set("ram",opts.ram);
  try{
    const nxt=await api("/api/state?"+q); const key=JSON.stringify(nxt,(k,v)=>k==="time"?undefined:v);
    const same=S&&key===refresh.last; refresh.last=key; S=nxt;
    if(!dirty)cfg=JSON.parse(JSON.stringify(S.config||{}));
    if(!Object.keys(weights).length)weights={...S.weights};
    if(!sel.cats)sel.cats=new Set(S.categories.map(c=>c[0]).filter(c=>c!=="toolcall"));
    side(); if(!same||force)render();
  }catch(e){const o=$("#sOllama");o.className="chip bad";o.textContent="hub error: "+e.message;}
}
function side(){
  const o=$("#sOllama"),hw=S.hw; o.className="chip "+(S.ollama.ok?"good":"bad"); o.textContent=S.ollama.ok?`Ollama: ${S.models.length} model${S.models.length===1?"":"s"}`:"Ollama not reachable"; o.title=S.ollama.error||S.ollama.host;
  $("#sHw").textContent=`${hw.gpu||"No dedicated GPU"}, ${fmt(hw.vram_gb,0)} GB VRAM, ${fmt(hw.ram_gb,0)} GB RAM`;
  const ld=S.loaded||[]; $("#sLoaded").textContent=ld.length?"loaded: "+ld.map(m=>m.name).join(", "):"";
}
function render(){
  if(!S)return; const v=$("#view");
  if(page==="console"){ if(!built.console){v.innerHTML="";put(v,...consolePage());built.console=1;} pollConsole(); return; }
  if(page==="studio"){ if(!built.studio){v.innerHTML="";put(v,...studioPage());built.studio=1;loadBacklog();} pollStudio(); return; }
  if(page==="tiers"){ if(!built.tiers){v.innerHTML="";put(v,...tiersPage());built.tiers=1;loadTeam();} return; }
  if(page==="queue"){ if(!built.queue){v.innerHTML="";put(v,...queuePage());built.queue=1;} loadQueue(); return; }
  if(page==="run"){ if(!built.run){v.innerHTML="";put(v,...runPage());built.run=1;fillExtras();} else updateRunLists(); return; }
  if(page==="launch"){ if(!built.launch){v.innerHTML="";put(v,...launchPage());built.launch=1;} pollLaunch(); return; }
  if(page==="doctor"){ if(!built.doctor){v.innerHTML="";put(v,...doctorPage());built.doctor=1;runDoctor();} return; }
  if(page==="assess"){ if(!built.assess){v.innerHTML="";put(v,...assessPage());built.assess=1;runAssess();} return; }
  if(page==="tune"){ if(!built.tune){v.innerHTML="";put(v,...tunePage());built.tune=1;loadTune();} return; }
  if(page==="advisor"){ if(!built.advisor){v.innerHTML="";put(v,...advisorPage());built.advisor=1;runAdvise();} return; }
  if(page==="bench"){ if(!built.bench){v.innerHTML="";put(v,...benchPage());built.bench=1;} loadBench(); return; }
  v.innerHTML=""; const fn={overview,start,models,roles,flows,portfolio,score:scoreboard,settings,train}[page]; put(v,...fn());
}


/* ============================================================================================
   The Console: one screen. What you asked for on the left, what the machine is doing on the
   right, and a strip across the top that answers "is it working, how fast, how much is left".
   The right-hand panel is built from the structured events a run prints as it goes -- plan
   steps, tool calls, check results, the verdict -- not from scraping the console text.
   ============================================================================================ */
const EV={since:0,epoch:-1,steps:[],tools:[],gates:[],esc:[],calls:0,tokens:0,tok_s:null,todo:[],
          now:null,nowModel:null,nowRole:null,nowTier:null,verdict:null,flow:null,running:false,sel:-1,cached:0};

function consolePage(){
  const msgs=h("div",{class:"msgs",id:"cMsgs"});
  const ta=h("textarea",{id:"cIn",rows:2,placeholder:"Say what you want done, or / for a saved command.",
    oninput:slashUpdate,
    onblur:()=>setTimeout(slashClose,120),
    onkeydown:e=>{
      if(SLASH.open){
        if(e.key==="ArrowDown"){e.preventDefault();SLASH.idx=Math.min(SLASH.idx+1,SLASH.items.length-1);slashDraw();return;}
        if(e.key==="ArrowUp"){e.preventDefault();SLASH.idx=Math.max(SLASH.idx-1,0);slashDraw();return;}
        if(e.key==="Tab"||(e.key==="Enter"&&SLASH.items.length&&!$("#cIn").value.slice(1).includes(" "))){
          e.preventDefault();slashPick(SLASH.items[SLASH.idx]);return;}
        if(e.key==="Escape"){e.preventDefault();slashClose();return;}
      }
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();cSend();}
    }});
  const thread=h("div",{class:"thread"},msgs,
    h("div",{class:"composer"},ta,
      h("button",{class:"btn pri",id:"cSend",onclick:cSend},"Send",icon("arrow")),
      h("div",{class:"hint"},
        h("span",{class:"pair"},h("kbd",{},"Enter"),"send"),
        h("span",{class:"pair"},h("kbd",{},"Shift"),h("kbd",{},"Enter"),"new line"),
        h("span",{class:"pair"},h("kbd",{},"Ctrl"),h("kbd",{},"K"),"commands"),
        h("span",{class:"pair"},h("kbd",{},"/"),"saved commands"),
        h("span",{class:"pair"},h("kbd",{},"Esc"),"stop"),
        h("span",{class:"grow"}),
        h("button",{class:"btn sm",onclick:cNew},icon("spark"),"New thread"),
        h("button",{class:"btn sm",onclick:()=>go("run")},icon("layers"),"More options"))));
  return [h("div",{class:"strip",id:"cStrip"}),
          h("div",{class:"console"},thread,h("div",{class:"doing",id:"cDoing"}))];
}

/* ---- the strip: measured numbers only, and it says when a number is not known yet ---- */
function renderStrip(){
  const el=$("#cStrip"); if(!el||!S)return;
  const maxc=(((cfg.limits||{}).max_calls)||60);
  const pct=Math.min(100,Math.round(100*EV.calls/maxc));
  const cls=pct>=90?"bad":pct>=70?"warn":"";
  const loaded=(S.loaded||[]).map(m=>m.name);
  const G=GPU;
  const kids=[
    h("span",{class:"sg"},h("i",{class:"dot "+(EV.running?"busy":S.ollama&&S.ollama.ok?"on":"off")}),
      h("b",{},EV.running?(EV.flow?"running "+EV.flow:"running"):"ready")),
    h("span",{class:"sep"}),
    h("span",{class:"sg",title:gpuTitle(G)},
      icon("chip"),h("b",{},S.hw.gpu?shortGpu(S.hw.gpu):"CPU only"),
      G&&G.vram_gb?h("span",{class:"meter"},h("i",{class:G.vram_used_gb/G.vram_gb>0.92?"warn":"",style:"width:"+Math.min(100,Math.round(100*G.vram_used_gb/G.vram_gb))+"%"})):null,
      h("span",{class:"num"},G&&G.vram_gb?fmt(G.vram_used_gb,1)+"/"+fmt(G.vram_gb,0)+" GB":fmt(S.hw.vram_gb,0)+" GB"),
      G&&G.gpu_pct!=null?h("span",{class:"num"},G.gpu_pct+"% busy"):null,
      (window.PULSE||[]).length>1?h("span",{class:"pulse",title:"graphics card use over the last 3 minutes",html:`<svg viewBox="0 0 72 18" width="72" height="18"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="${PULSE.map((v,i)=>(i*72/35).toFixed(1)+","+(17-v*0.16).toFixed(1)).join(" ")}"/></svg>`}):null),
  ];
  const spill=G?(G.tiers||[]).filter(t=>t.up&&!t.full_gpu&&!t.cpu_only&&Number(t.ram_gb)>0):[];
  if(spill.length) kids.push(h("span",{class:"sep"}),
    h("span",{class:"chip warn",title:spill.map(t=>`${t.tier} (${t.name}): about ${fmt(t.gpu_gb,1)} GB on the card and ${fmt(t.ram_gb,1)} GB in RAM`+
      (t.moe_cpu_layers?`; the experts of ${t.moe_cpu_layers} layers stay in RAM`:"")).join("; ")+
      ". The card waits on RAM for that part, so it can look idle while the model is working."},
      icon("layers"),"part in RAM: "+spill.map(t=>t.tier).join(", ")));
  if(S.cloud&&S.cloud.on) kids.push(h("span",{class:"sep"}),h("span",{class:"chip "+(S.cloud.ready?"good":"warn"),title:S.cloud.text+". Settings > Online."},icon("globe"),S.cloud.ready?"Claude on":"Claude not ready"));
  if(G&&G.vm_gb) kids.push(h("span",{class:"sep"}),
    h("span",{class:"sg",title:`The WSL2 / Docker Desktop VM holds ${fmt(G.vm_gb,1)} GB of RAM now`+(G.vm_limit_gb?` and may grow to ${fmt(G.vm_limit_gb,0)} GB (its limit)`:"")+
      ". Architect plans around it. When you do not need Docker for a while, quitting Docker Desktop and running wsl --shutdown gives the memory back."},
      icon("layers"),h("b",{},"Docker/WSL"),h("span",{class:"num"},fmt(G.vm_gb,1)+" GB")));
  if(loaded.length) kids.push(h("span",{class:"sep"}),
    h("span",{class:"sg",title:"loaded and staying loaded: "+loaded.join(", ")},icon("layers"),
      h("b",{},loaded.length+(loaded.length===1?" model":" models")),"resident"));
  if(EV.nowModel) kids.push(h("span",{class:"sep"}),
    h("span",{class:"sg",title:"the tier answering right now"},icon("spark"),h("b",{},EV.nowModel),
      EV.nowTier?h("span",{},EV.nowTier):null));
  if(EV.tok_s) kids.push(h("span",{class:"sep"}),
    h("span",{class:"sg",title:"generation speed the server itself reported on the last call"},
      h("b",{class:"num"},fmt(EV.tok_s,1)),"tokens/s"));
  if(EV.calls||EV.running) kids.push(h("span",{class:"sep"}),
    h("span",{class:"sg",title:"model calls used, out of the limit in Settings > Limits"},
      h("span",{class:"meter"},h("i",{class:cls,style:"width:"+pct+"%"})),
      h("span",{class:"num"},EV.calls+"/"+maxc),"calls"));
  else kids.push(h("span",{class:"sep"}),
    h("span",{class:"sg mute",title:"nothing has run yet in this session"},icon("check"),"idle"));
  if(EV.tokens) kids.push(h("span",{class:"sg",title:"tokens this run has generated"},
      h("span",{class:"num"},kfmt(EV.tokens)),"tokens"));
  if(EV.cached) kids.push(h("span",{class:"sg",title:"answers reused from a reply already given to exactly the same question"},
      icon("check"),h("span",{class:"num"},EV.cached),"reused"));
  kids.push(h("button",{class:"btn sm killbtn",disabled:!EV.running,title:"Stop between steps (Esc)",onclick:cStop},icon("stop"),"Stop"));
  el.innerHTML=""; put(el,...kids);
}
var GPU=null;            // /api/arch/gpu, polled every 5 s while the console is open
function gpuTitle(G){
  if(!G||G.vram_gb==null) return (S.hw.gpu||"no dedicated GPU")+", "+fmt(S.hw.ram_gb,0)+" GB RAM";
  return `Graphics card, live: ${G.gpu_pct}% busy, ${fmt(G.vram_used_gb,1)} of ${fmt(G.vram_gb,1)} GB in use. RAM: ${fmt(G.ram_free_gb,1)} of ${fmt(G.ram_gb,0)} GB free. `+
    "Windows Task Manager shows the 3D engine by default; model work runs on CUDA, so switch one of its graphs to Cuda to see it there.";
}
async function pollGpu(){
  if(document.hidden||!$("#cStrip")) return;
  try{ GPU=await api("/api/arch/gpu"); (window.PULSE=window.PULSE||[]).push(GPU.gpu_pct||0); if(PULSE.length>36)PULSE.shift(); renderStrip(); }catch(_){}
}
setInterval(pollGpu,5000); setTimeout(pollGpu,800);
const kfmt=n=>n==null?"–":n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n);
const shortGpu=g=>String(g).replace(/NVIDIA |GeForce |Laptop GPU/g,"").trim();

/* ---- the live panel ---- */
function renderDoing(){
  const el=$("#cDoing"); if(!el)return;
  el.innerHTML="";
  const kids=[h("h3",{},icon("play"),"What I'm doing")];
  if(!EV.steps.length&&!EV.now&&!EV.verdict){
    kids.push(h("div",{class:"idle"},icon("console","lg"),
      h("div",{},"Nothing running."),
      h("div",{style:"max-width:30ch"},"Ask for something on the left. The plan, every tool it uses and every check it runs will appear here as it happens.")));
    put(el,...kids); return;
  }
  if(EV.live&&!EV.verdict)kids.push(h("div",{class:"sect"},h("p",{class:"lbl"},"Writing now · "+(EV.liveRole||"")),
    h("pre",{class:"livetxt"},EV.live),h("div",{class:"small mute"},EV.liveModel||"")));
  if((EV.lanes||[]).length)kids.push(laneView());
  if(EV.steps.length||EV.now){
    const ul=h("ul",{class:"plan"});
    EV.steps.forEach((st,i)=>{
      const cls=st.status==="skipped"?"skip":st.unsure?"unsure":st.ok===true?"done":st.ok===false?"fail":"done";
      const ico=st.status==="skipped"?"dash":st.unsure?"question":st.ok===false?"x":"check";
      ul.append(h("li",{class:cls+(EV.sel===i?" sel":""),tabindex:"0",title:stepTitle(st),
        onclick:()=>{EV.sel=EV.sel===i?-1:i;renderDoing();}},icon(ico),
        h("span",{},h("span",{},prettyStep(st.step)),
          st.secs?h("span",{class:"mute small num"}," "+fmt(st.secs,0)+"s"):null,
          st.tries>1?h("span",{class:"mute small"}," · "+st.tries+" tries"):null,
          EV.sel===i?stepFacets(st):null)));
    });
    if(EV.now&&!EV.steps.some(x=>x.step===EV.now))
      ul.append(h("li",{class:"now"},icon("dot"),h("span",{},prettyStep(EV.now),
        EV.nowRole?h("span",{class:"mute small"}," · "+EV.nowRole):null)));
    (EV.todo||[]).filter(t=>!EV.steps.some(x=>x.step===t.id)&&t.id!==EV.now&&t.status==="pending")
      .forEach(t=>ul.append(h("li",{class:"todo",title:"still to come"},icon("dot"),h("span",{},t.title))));

/* ---- events: one cursor, no re-reading ---- */
function applyEvents(feed){
  if(feed.epoch!==EV.epoch){                        // a new run: start the panel over rather than appending to the last one
    EV.epoch=feed.epoch;EV.since=0;EV.lanes=[];EV.live="";EV.steps=[];EV.tools=[];EV.gates=[];EV.esc=[];EV.todo=[];
    EV.calls=0;EV.tokens=0;EV.tok_s=null;EV.now=null;EV.nowModel=null;EV.nowRole=null;EV.nowTier=null;EV.verdict=null;EV.post=null;EV.flow=null;EV.cached=0;EV.sel=-1;
  }
  EV.running=!!feed.running;
  for(const ev of feed.events||[]){
    const t=ev.type;
    if(ev.flow)EV.flow=ev.flow; if(ev.run)EV.run=ev.run;
    if(t==="call"){
      EV.calls++; EV.tokens+=(ev.gen_tokens||0);
      if(ev.tok_s)EV.tok_s=ev.tok_s;
      if(ev.cached)EV.cached++;
      EV.nowModel=ev.model||EV.nowModel; EV.nowRole=ev.role||EV.nowRole; EV.nowTier=ev.tier||EV.nowTier;
      if(ev.label)EV.now=ev.label;
      (EV.lanes=EV.lanes||[]).push({tier:ev.tier||"worker",role:ev.role,model:ev.model,secs:ev.secs||0,t:ev.t,ok:ev.done_reason!=="error"});
      EV.live="";
    } else if(t==="token"){ EV.live=((EV.live||"")+ev.text).slice(-900); EV.liveRole=ev.label||ev.role; EV.liveModel=ev.model; } else if(t==="tool"){ EV.tools.push(ev); if(ev.step)EV.now=ev.step; }
    else if(t==="check"){ EV.gates.push(ev); if(ev.step)EV.now=ev.step; }
    else if(t==="escalation"){ EV.esc.push(ev); }
    else if(t==="todo"){ EV.todo=ev.items||[]; }
    else if(t==="step"){
      const i=EV.steps.findIndex(x=>x.step===ev.step);
      if(i>=0)EV.steps[i]=ev; else EV.steps.push(ev);
      if(EV.now===ev.step)EV.now=null;
    }
    else if(t==="postmortem"){ EV.post=ev; }
    else if(t==="verdict"){ EV.verdict=ev; EV.now=null;
      if(ev.meter){EV.calls=ev.meter.calls||EV.calls;EV.tokens=(ev.meter.tokens_out||0);} }
  }
  EV.since=feed.next;
}

/* Minimal, safe formatting: fenced code, inline code, paragraphs. No HTML from the model is ever inserted. */
function renderText(t){
  const out=[];
  for(const part of String(t).split(/```/).entries()){
    const [i,chunk]=part;
    if(i%2===1){ out.push(h("pre",{},h("code",{},chunk.replace(/^\w*\n/,"")))); continue; }
    for(const para of chunk.split(/\n{2,}/)){
      if(!para.trim())continue;
      const p=h("p",{});
      para.split(/(`[^`]+`)/).forEach(bit=>{
        if(bit.startsWith("`")&&bit.endsWith("`")&&bit.length>2)p.append(h("code",{},bit.slice(1,-1)));
        else if(bit)p.append(document.createTextNode(bit));
      });
      out.push(p);
    }
  }
  return out;
}
